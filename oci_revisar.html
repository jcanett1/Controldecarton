<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisar OCI - Sistema de Cartón</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header-left p {
            opacity: 0.9;
            font-size: 14px;
        }

        .btn-volver {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-volver:hover {
            background: rgba(255, 255, 255, 0.3);

        .user-info {

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);

        }

        .encabezado-lista-oci {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .encabezado-lista-oci h2 {
            font-size: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filtros-lista {
            padding: 20px;

        .filtros-lista input {

        .btn {

            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        }

        .btn-primary:hover {

            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;

        }

        .btn-secondary:hover {

        }

        .btn-sm {

        .btn-info {

        .btn-info:hover {

        .btn-success {

            color: white;

        .btn-success:hover {

        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .tabla-oci {
            overflow-x: auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #e0e0e0;

        th {

            font-weight: 600;

        .estado-pendiente {

        .estado-aprobada {

            color: #155724;

        .estado-rechazada {

        }

        .fila-aprobada {

        .empty-state {

            padding: 40px;

        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .acciones {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        /* Estilos para botones de documentos */
        .btn-doc {

        .btn-doc.btn-oc-mtk:hover {

        .btn-doc.btn-zor {

        .btn-doc.btn-zor:hover {

            color: white;

        .upload-area {

        .upload-area:hover {

        .upload-area.dragover {

        .upload-area p {
            color: #666;

        }

        .upload-area .file-types {

            color: #999;
        }

        .file-preview {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-preview i {
            font-size: 24px;
            color: #ef4444;
        }

        .file-preview .file-info {
            flex: 1;
            text-align: left;
        }

        .file-preview .file-name {
            font-weight: 600;
            color: #333;
        }

        .file-preview .file-size {
            font-size: 12px;
            color: #666;
        }

        .file-preview .remove-file {
            background: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            .filtros-lista {
                flex-direction: column;

            .filtros-lista input {
                min-width: 100%;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px;
            }

            .acciones {
                flex-direction: column;
            }
        }

        /* MODAL DE DETALLES */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 25px;
            overflow-y: auto;
            max-height: calc(85vh - 140px);
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section:last-child {
            margin-bottom: 0;
        }

        .detail-section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #667eea;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .detail-item {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .detail-item.full-width {
            grid-column: 1 / -1;
        }

        .detail-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 15px;
            color: #333;
            font-weight: 500;
        }

        .material-list {
            background: #f8f9fa;
            border-radius: 8px;
            overflow: hidden;
        }

        .material-item {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .material-item:last-child {
            border-bottom: none;
        }

        .material-item:hover {
            background: #e9ecef;
        }

        .material-numero {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .material-numero i {
            color: #667eea;
            margin-right: 6px;
        }

        .material-cantidad {
            text-align: right;
        }

        .material-cantidad .pallets {
            font-size: 13px;

        }

        .material-cantidad .piezas {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .total-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            display: flex;

        .total-label {
            font-size: 14px;

        }

        .total-values {

        .observaciones-box {

        .observaciones-box i {

        }

        .modal-footer {
            padding: 15px 25px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;

        .btn-modal {
            padding: 10px 25px;
            border: none;

        .status {

        .status-pendiente { background: #fff3cd; color: #856404; }
        .status-aprobada { background: #d4edda; color: #155724; }

        .status-cancelada { background: #e2e3e5; color: #383d41; }

</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1><i class="fas fa-list-check"></i> Revisar Órdenes de Compra Interna</h1>
                <p>Sistema de Control de Cartón - OCI</p>
            </div>
            <button onclick="volverAlIndex()" class="btn-volver">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
        </div>

        <!-- User Info -->
        <div class="user-info">
            <strong>Usuario:</strong> <span id="usuario-actual">Cargando...</span>
        </div>

        <!-- Contenedor Lista OCI -->
        <div class="contenedor-lista-oci">
            <div class="encabezado-lista-oci">
                <h2><i class="fas fa-clipboard-list"></i> Lista de Órdenes de Compra Interna</h2>
            </div>
            
            <div class="filtros-lista">
                <input type="text" id="filtro-busqueda" placeholder="Buscar por número OCI o usuario..." style="flex: 1;">
                <select id="filtro-estado">
                    <option value="">Todos los estados</option>
                    <option value="PENDIENTE">Pendiente</option>
                    <option value="APROBADA">Aprobada</option>
                    <option value="RECHAZADA">Rechazada</option>
                    <option value="CANCELADA">Cancelada</option>
                </select>
                <button onclick="filtrarOrdenes()" class="btn btn-primary">
                    <i class="fas fa-search"></i>
                    Filtrar
                </button>
                <button onclick="recargarOrdenes()" class="btn btn-secondary">
                    <i class="fas fa-sync-alt"></i>
                    Recargar
                </button>
            </div>
            
            <div class="tabla-oci">
                <table id="tabla-ordenes">
                    <thead>
                        <tr>
                            <th>Número OCI</th>
                            <th>Fecha</th>
                            <th>Usuario</th>
                            <th>Material</th>
                            <th>Pallets</th>
                            <th>Total Piezas</th>
                            <th>OC-MTK</th>
                            <th>Total Real a Enviar (piezas)</th>
                            <th>ZOR</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla-ordenes">
                        <tr>
                            <td colspan="11" class="cargando">
                                <div class="spinner-oci"></div>
                                <p>Cargando órdenes...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal de Detalles OCI -->
    <div id="modalDetalles" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-file-invoice"></i> <span id="modalTitulo">Detalles de OCI</span></h2>
                <button class="modal-close" onclick="cerrarModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Contenido dinámico -->
            </div>
            <div class="modal-footer">
                <button class="btn-modal btn-modal-primary" onclick="cerrarModal()">
                    <i class="fas fa-check"></i> Aceptar
                </button>
            </div>
        </div>
    </div>

  <!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ===== CONFIGURACIÓN GLOBAL SUPABASE =====
    if (!window.supabaseClient) {
        const supabaseUrl = 'https://bdrxcilsuxbkpmolfbgu.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkcnhjaWxzdXhia3Btb2xmYmd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQyNTQ0NTcsImV4cCI6MjA2OTgzMDQ1N30.iSO9EoOMEoi_VARxPqMd2yMUvQvTmKJntxJvwAl-TVs';

        window.supabaseClient = supabase.createClient(
            supabaseUrl,
            supabaseAnonKey
        );
    }

    const supabaseClient = window.supabaseClient;

    let usuarioActual = null;
    let ordenesOriginal = [];

    document.addEventListener('DOMContentLoaded', async () => {
        console.log('Inicializando revisor de OCI...');
        await cargarUsuario();
        await cargarOrdenes();
    });

        // ===== CARGAR USUARIO =====
        async function cargarUsuario() {
            try {
                const storedUser = localStorage.getItem('current_user');
                if (!storedUser) {
                    window.location.href = 'login_completo.html';
                    return;
                }

                usuarioActual = JSON.parse(storedUser);
                document.getElementById('usuario-actual').textContent = usuarioActual.nombre_completo || usuarioActual.username;
                console.log('Usuario cargado:', usuarioActual.nombre_completo);
            } catch (error) {
                console.error('Error cargando usuario:', error);
            }
        }

        // ===== CARGAR ÓRDENES =====
        async function cargarOrdenes() {
            try {
                console.log('Cargando órdenes...');
                const tbody = document.getElementById('cuerpo-tabla-ordenes');
                
                const { data, error } = await supabaseClient
                    .from('ordenes_compra')
                    .select('*, usuarios_carton!ordenes_compra_usuario_solicitante_id_fkey(nombre_completo)')
                    .order('fecha_creacion', { ascending: false });

                if (error) {
                    console.error('Error cargando órdenes:', error);

        // ===== FILTRAR ÓRDENES =====
        function filtrarOrdenes() {
            const busqueda = document.getElementById('filtro-busqueda').value.toLowerCase();
            const estado = document.getElementById('filtro-estado').value;

            let ordenesFiltradas = ordenesOriginal.filter(orden => {
                const cumpleBusqueda = orden.numero_oci.toLowerCase().includes(busqueda) ||
                                     (orden.usuarios_carton?.nombre_completo || '').toLowerCase().includes(busqueda);
                
                const cumpleEstado = !estado || orden.estado === estado;

                return cumpleBusqueda && cumpleEstado;
            });

            if (ordenesFiltradas.length === 0) {
                document.getElementById('cuerpo-tabla-ordenes').innerHTML = '<tr><td colspan="11" class="empty-state"><i class="fas fa-search"></i><p>No se encontraron órdenes</p></td></tr>';
                return;

            renderizarTabla(ordenesFiltradas);

            tbody.innerHTML = ordenes.map(orden => {
                const fecha = new Date(orden.fecha_creacion).toLocaleDateString('es-ES');
                const totalPiezas = orden.cantidad_total_piezas || (orden.piezas_por_pallet * orden.cantidad_pallets);
                const usuario = orden.usuarios_carton?.nombre_completo || 'N/A';
                const estadoClass = 'estado-' + orden.estado.toLowerCase();
                
                // OC-MTK viene de la creación de la orden (solo lectura)

                    ? '<span class="oc-mtk-display">' + orden.oc_mtk + '</span>' 
                    : '<span class="oc-mtk-empty">Sin asignar</span>';
                
                // ✨ MODIFICADO: Mostrar valor manual guardado (no recalcular)
                // Si existe qty_a_enviar_piezas (valor manual), usarlo; si no, calcular de qty_a_enviar
                const qtyEnviarPiezas = orden.qty_a_enviar_piezas 
                    ? orden.qty_a_enviar_piezas 
                    : (orden.qty_a_enviar ? (orden.qty_a_enviar * (orden.piezas_por_pallet || 1)) : '');
                const qtyClass = orden.qty_a_enviar_piezas || orden.qty_a_enviar ? 'qty-saved' : '';
                
                // ZOR - campo de texto editable
                const zorNumero = orden.zor || '';
                const zorClass = orden.zor ? 'zor-saved' : '';
                
                // ✅ NUEVO: Determinar si mostrar botones según el estado
                const esAprobadaORecibida = orden.estado === 'APROBADA' || orden.estado === 'RECIBIDA';
                const filaClass = esAprobadaORecibida ? ' class="fila-aprobada"' : '';

                    '<td>#' + orden.material_numero + '</td>' +
                    '<td>' + orden.cantidad_pallets + '</td>' +

                            'min="0" ' +

                            'title="Cantidad de piezas a enviar" ' +

        // ===== APROBAR ORDEN =====
        async function aprobarOrden(ociId) {
            if (!confirm('¿Deseas aprobar esta orden?')) return;

            try {
                // 1. Obtener datos de la orden
                const { data: orden, error: errorOrden } = await supabaseClient
                    .from('ordenes_compra')
                    .select('*')
                    .eq('id', ociId)
                    .single();

                if (errorOrden) throw errorOrden;

                console.log('📝 Orden a aprobar:', orden);

                // 2. Actualizar estado a APROBADA
                const { error: errorUpdate } = await supabaseClient
                    .from('ordenes_compra')
                    .update({ estado: 'APROBADA' })
                    .eq('id', ociId);

                if (errorUpdate) throw errorUpdate;

                // 3. ✨ NUEVO: Actualizar balance si tiene qty_a_enviar y material_numero
                if ((orden.qty_a_enviar_piezas || orden.qty_a_enviar) && orden.material_numero) {
                    console.log('🔄 Actualizando balance para material:', orden.material_numero);
                    
                    // ✨ CORREGIDO: Usar qty_a_enviar_piezas (valor manual) si existe
                    const piezasEnviadas = orden.qty_a_enviar_piezas 
                        ? orden.qty_a_enviar_piezas 
                        : (orden.qty_a_enviar * (orden.piezas_por_pallet || 1));
                    console.log('📦 Piezas enviadas (real):', piezasEnviadas);

                    // ✨ NUEVO: Obtener piezas pedidas del historial de uso
                    const { data: historialUso, error: errorHistorial } = await supabaseClient
                        .from('oci_balances_usados')
                        .select('cantidad_piezas_usadas, balance_id')
                        .eq('numero_oci', orden.numero_oci)
                        .eq('material_numero', orden.material_numero)
                        .single();

                    if (errorHistorial || !historialUso) {
                        console.error('⚠️ No se encontró historial de uso para esta OCI');
                        return;
                    }

                    const piezasPedidas = historialUso.cantidad_piezas_usadas;
                    const balanceId = historialUso.balance_id;
                    console.log('📝 Piezas pedidas:', piezasPedidas);

                    // Calcular diferencia (lo que se debe devolver al balance)
                    const diferencia = piezasPedidas - piezasEnviadas;
                    console.log('🧮 Diferencia (pedido - enviado):', diferencia);

                    // Buscar balance por ID
                    const { data: balanceEncontrado, error: errorBalance } = await supabaseClient
                        .from('balances_veritiv')
                        .select('id, balance, material_carton')
                        .eq('id', balanceId)
                        .single();

                    if (errorBalance || !balanceEncontrado) {
                        console.error('⚠️ Error buscando balance:', errorBalance);
                        return;
                    }

                    console.log('✅ Balance encontrado:', balanceEncontrado);
                    
                    // ✨ CORREGIDO: Devolver la diferencia al balance
                    const balanceActual = parseFloat(balanceEncontrado.balance);
                    const nuevoBalance = balanceActual + diferencia;

                    console.log(`📊 Balance actual: ${balanceActual} + Diferencia: ${diferencia} = Nuevo balance: ${nuevoBalance}`);

                    // Actualizar balance
                    const { error: errorUpdateBalance } = await supabaseClient
                        .from('balances_veritiv')
                        .update({ 
                            balance: nuevoBalance >= 0 ? nuevoBalance : 0,
                            fecha_actualizacion: new Date().toISOString()
                        })
                        .eq('id', balanceEncontrado.id);

                    if (errorUpdateBalance) {
                        console.error('❌ Error actualizando balance:', errorUpdateBalance);
                    } else {
                        console.log('✅ Balance actualizado exitosamente: ', nuevoBalance);
                    }
                
                } else {
                    console.log('ℹ️ No hay qty_a_enviar o material_numero, no se actualiza balance');
                }

                alert('Orden aprobada exitosamente\n\n✅ Balance actualizado automáticamente');
                cargarOrdenes();
            } catch (error) {
                console.error('Error:', error);
                alert('Error aprobando la orden: ' + error.message);
            }
        }

        // ===== VARIABLES PARA SUBIDA DE ARCHIVOS =====
        let ordenActualId = null;

        // ===== ABRIR MODAL SUBIR ARCHIVO =====
        function abrirModalSubirArchivo(ordenId, tipoArchivo) {
            ordenActualId = ordenId;
            tipoArchivoActual = tipoArchivo;
            archivoSeleccionado = null;

            // Buscar la orden para ver si ya tiene archivo
            const orden = ordenesOriginal.find(o => o.id === ordenId);
            const urlExistente = tipoArchivo === 'oc_mtk' ? orden.oc_mtk_url : orden.zor_url;
            const nombreTipo = tipoArchivo === 'oc_mtk' ? 'OC-MTK' : 'ZOR';

            let modalContent = '' +
                '<div class="upload-modal-content">' +
                '<p>Subir documento PDF para <strong>' + nombreTipo + '</strong></p>' +
                '<p style="font-size: 12px; color: #666;">OCI: ' + orden.numero_oci + ' | Material: #' + orden.material_numero + '</p>';

            if (urlExistente) {
                modalContent += '' +
                    '<div class="file-preview" id="archivo-existente">' +
                    '<i class="fas fa-file-pdf"></i>' +
                    '<div class="file-info">' +
                    '<div class="file-name">Documento actual</div>' +
                    '<div class="file-size"><a href="' + urlExistente + '" target="_blank">Ver PDF</a></div>' +
                    '</div>' +
                    '</div>';
            }

            modalContent += '' +
                '<div class="upload-area" id="upload-area" onclick="document.getElementById(\x27file-input\x27).click()">' +
                '<i class="fas fa-cloud-upload-alt"></i>' +
                '<p>' + (urlExistente ? 'Subir nuevo archivo para reemplazar' : 'Haz clic o arrastra un archivo aquí') + '</p>' +
                '<span class="file-types">Solo archivos PDF (máx. 10MB)</span>' +
                '</div>' +
                '<input type="file" id="file-input" class="hidden-file-input" accept=".pdf" onchange="archivoSeleccionadoHandler(this)">' +
                '<div id="file-preview-container"></div>' +
                '</div>';

            document.getElementById('modalTitulo').textContent = 'Subir ' + nombreTipo;
            document.getElementById('modalBody').innerHTML = modalContent;
            document.getElementById('modalDetalles').classList.add('active');

            // Configurar drag and drop
            setTimeout(function() {
                const uploadArea = document.getElementById('upload-area');
                if (uploadArea) {
                    uploadArea.addEventListener('dragover', function(e) {
                        e.preventDefault();
                        this.classList.add('dragover');
                    });
                    uploadArea.addEventListener('dragleave', function(e) {
                        e.preventDefault();
                        this.classList.remove('dragover');
                    });
                    uploadArea.addEventListener('drop', function(e) {
                        e.preventDefault();
                        this.classList.remove('dragover');
                        if (e.dataTransfer.files.length > 0) {
                            document.getElementById('file-input').files = e.dataTransfer.files;
                            archivoSeleccionadoHandler(document.getElementById('file-input'));
                        }
                    });
                }
            }, 100);
        }

        // ===== ARCHIVO SELECCIONADO HANDLER =====
        function archivoSeleccionadoHandler(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                
                // Validar tipo de archivo
                if (file.type !== 'application/pdf') {
                    alert('Solo se permiten archivos PDF');
                    input.value = '';
                    return;
                }

                // Validar tamaño (10MB)
                if (file.size > 10 * 1024 * 1024) {
                    alert('El archivo no puede superar los 10MB');
                    input.value = '';
                    return;
                }

                archivoSeleccionado = file;
                const fileSize = (file.size / 1024).toFixed(1) + ' KB';
                if (file.size > 1024 * 1024) {
                    fileSize = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
                }

                document.getElementById('file-preview-container').innerHTML = '' +
                    '<div class="file-preview">' +
                    '<i class="fas fa-file-pdf"></i>' +
                    '<div class="file-info">' +
                    '<div class="file-name">' + file.name + '</div>' +
                    '<div class="file-size">' + fileSize + '</div>' +
                    '</div>' +
                    '<button class="remove-file" onclick="removerArchivo()"><i class="fas fa-times"></i></button>' +
                    '</div>' +
                    '<button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="subirArchivo()">' +
                    '<i class="fas fa-upload"></i> Subir Archivo' +
                    '</button>';
            }
        }

        // ===== REMOVER ARCHIVO =====
        function removerArchivo() {
            archivoSeleccionado = null;
            document.getElementById('file-input').value = '';
            document.getElementById('file-preview-container').innerHTML = '';
        }

        // ===== SUBIR ARCHIVO =====
        async function subirArchivo() {
            if (!archivoSeleccionado || !ordenActualId || !tipoArchivoActual) {
                alert('No hay archivo seleccionado');
                return;
            }

            const btn = document.querySelector('#file-preview-container .btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Subiendo...';

            try {
                // Generar nombre único para el archivo
                const timestamp = Date.now();
                const nombreArchivo = tipoArchivoActual + '_' + ordenActualId + '_' + timestamp + '.pdf';
                const rutaArchivo = 'oci_documentos/' + nombreArchivo;

                // Subir a Supabase Storage
                const { data: uploadData, error: uploadError } = await supabaseClient
                    .storage
                    .from('documentos')
                    .upload(rutaArchivo, archivoSeleccionado, {
                        cacheControl: '3600',
                        upsert: true
                    });

                if (uploadError) throw uploadError;

                // Obtener URL pública
                const { data: urlData } = supabaseClient
                    .storage
                    .from('documentos')
                    .getPublicUrl(rutaArchivo);

                const urlPublica = urlData.publicUrl;

                // Actualizar la orden con la URL del archivo
                const campoActualizar = tipoArchivoActual === 'oc_mtk' ? 'oc_mtk_url' : 'zor_url';
                const updateData = {};
                updateData[campoActualizar] = urlPublica;

                const { error: updateError } = await supabaseClient
                    .from('ordenes_compra')
                    .update(updateData)
                    .eq('id', ordenActualId);

                if (updateError) throw updateError;

                alert('Archivo subido exitosamente');
                cerrarModal();
                cargarOrdenes();

            } catch (error) {
                console.error('Error subiendo archivo:', error);
                alert('Error al subir el archivo: ' + error.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-upload"></i> Subir Archivo';
            }
        }

        // ===== GUARDAR QTY A ENVIAR EN PIEZAS =====
        async function guardarQtyEnviarPiezas(ordenId, cantidadPiezas, piezasPorPallet) {
            const input = document.querySelector('tr[data-id="' + ordenId + '"] .qty-input');
            
            try {
                const cantidadPiezasNum = parseInt(cantidadPiezas) || 0;
                // Convertir piezas a pallets para compatibilidad
                const cantidadPallets = Math.ceil(cantidadPiezasNum / piezasPorPallet);

                // ✨ NUEVO: Guardar AMBOS valores - piezas manual y pallets calculado
                const { error } = await supabaseClient
                    .from('ordenes_compra')
                    .update({ 
                        qty_a_enviar: cantidadPallets,
                        qty_a_enviar_piezas: cantidadPiezasNum  // 👈 Valor manual en piezas
                    })
                    .eq('id', ordenId);

                if (error) throw error;

                console.log('✅ Guardado: Piezas manuales =', cantidadPiezasNum, ', Pallets =', cantidadPallets);

                // Actualizar visualmente
                input.classList.add('qty-saved');
                
                // Actualizar en el array local
                const orden = ordenesOriginal.find(o => o.id === ordenId);
                if (orden) {
                    orden.qty_a_enviar = cantidadPallets;
                    orden.qty_a_enviar_piezas = cantidadPiezasNum;  // 👈 Actualizar también en local
                }

                // Mostrar feedback temporal
                setTimeout(function() {
                    input.classList.remove('qty-saved');
                }, 2000);

            } catch (error) {
                console.error('Error guardando cantidad:', error);
                alert('Error al guardar la cantidad: ' + error.message);
            }
        }

        // ===== GUARDAR QTY A ENVIAR (LEGACY - mantener por compatibilidad) =====
        async function guardarQtyEnviar(ordenId, cantidad) {
            const input = document.querySelector('tr[data-id="' + ordenId + '"] .qty-input');
            
            try {
                const cantidadNum = parseInt(cantidad) || 0;

                const { error } = await supabaseClient
                    .from('ordenes_compra')
                    .update({ qty_a_enviar: cantidadNum })
                    .eq('id', ordenId);

                if (error) throw error;

                // Actualizar visualmente
                input.classList.add('qty-saved');
                
                // Actualizar en el array local
                const orden = ordenesOriginal.find(o => o.id === ordenId);
                if (orden) orden.qty_a_enviar = cantidadNum;

                // Mostrar feedback temporal
                setTimeout(function() {
                    input.classList.remove('qty-saved');
                }, 2000);

            } catch (error) {
                console.error('Error guardando cantidad:', error);
                alert('Error al guardar la cantidad');
            }
        }

        // ===== GUARDAR ZOR =====
        async function guardarZor(ordenId, zorNumero) {
            const input = document.querySelector('tr[data-id="' + ordenId + '"] .zor-input');
            
            try {
                const zorValue = zorNumero.trim() || null;

                const { error } = await supabaseClient
                    .from('ordenes_compra')
                    .update({ zor: zorValue })
                    .eq('id', ordenId);

                if (error) throw error;

                // Actualizar visualmente
                if (zorValue) {
                    input.classList.add('zor-saved');
                } else {
                    input.classList.remove('zor-saved');
                }
                
                // Actualizar en el array local
                const orden = ordenesOriginal.find(o => o.id === ordenId);
                if (orden) orden.zor = zorValue;

                // Mostrar feedback temporal
                setTimeout(function() {
                    if (zorValue) {
                        input.classList.add('zor-saved');
                    }
                }, 2000);

            } catch (error) {
                console.error('Error guardando ZOR:', error);
                alert('Error al guardar el número ZOR');
            }
        }
    </script>
