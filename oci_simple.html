<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden de Compra - Material de Cartón</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header-left p {
            opacity: 0.9;
            font-size: 14px;
        }

        .btn-volver {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-volver:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .user-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
        }

        /* PESTAÑAS */
        .tabs-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 30px;
        }

        .tabs-header {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            background: #f8f9fa;
        }

        .tab-button {
            flex: 1;
            padding: 16px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
            position: relative;
            text-align: center;
        }

        .tab-button:hover {
            background: #f0f1f5;
            color: #333;
        }

        .tab-button.active {
            color: #667eea;
            background: white;
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .tabs-content {
            padding: 30px;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* FORMULARIO */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[readonly], input[disabled] {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23667eea' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            padding-right: 40px;
        }

        .material-info {
            background: #f0f1f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .material-info.active {
            display: block;
        }

        .material-info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .material-info-row:last-child {
            border-bottom: none;
        }

        .material-info-label {
            font-weight: 600;
            color: #666;
        }

        .material-info-value {
            color: #333;
            font-weight: 500;
        }

        /* BOTONES */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* TABLA */
        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            color: #666;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #e0e0e0;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pendiente {
            background: #fff3cd;
            color: #856404;
        }

        .status-aprobada {
            background: #d4edda;
            color: #155724;
        }

        .status-recibida {
            background: #cfe2ff;
            color: #084298;
        }

        .status-foliada {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-pagada {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-info {
            background: #0066cc;
            color: white;
        }

        .btn-info:hover {
            background: #0052a3;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            .button-group {
                flex-direction: column;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1><i class="fas fa-boxes"></i> Gestión de Órdenes de Compra Interna</h1>
                <p>Sistema de Control de Cartón - OCI</p>
            </div>
            <button onclick="volverAlIndex()" class="btn-volver">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
        </div>

        <!-- User Info -->
        <div class="user-info">
            <strong>Usuario:</strong> <span id="usuario-actual">Cargando...</span>
        </div>

        <!-- Tabs Container -->
        <div class="tabs-container">
            <div class="tabs-header">
                <button class="tab-button active" data-tab="crear">
                    <i class="fas fa-plus-circle"></i> Crear OCI
                </button>
                <button class="tab-button" data-tab="historico">
                    <i class="fas fa-history"></i> Consulta Histórico de OCI
                </button>
            </div>

            <div class="tabs-content">
                <!-- TAB 1: CREAR OCI -->
                <div id="crear" class="tab-pane active">
                    <form id="ordenForm">
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                            <div class="form-group">
                                <label><i class="fas fa-hashtag"></i> Número de OCI:</label>
                                <input type="text" id="numeroOci" readonly>
                            </div>
                            
                            <div class="form-group">
                                <label><i class="fas fa-calendar"></i> Fecha de Creación:</label>
                                <input type="datetime-local" id="fechaCreacion" readonly>
                            </div>
                            
                            <div class="form-group">
                                <label><i class="fas fa-user"></i> Usuario que Solicita:</label>
                                <input type="text" id="usuarioSolicitante" readonly>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-cube"></i> Seleccionar Material de Cartón:</label>
                            <select id="materialSelect" onchange="seleccionarMaterial()">
                                <option value="">-- Selecciona un material --</option>
                            </select>
                            <div id="materialInfo" class="material-info">
                                <div class="material-info-row">
                                    <span class="material-info-label">Número de Material:</span>
                                    <span class="material-info-value" id="infoNumero">-</span>
                                </div>
                                <div class="material-info-row">
                                    <span class="material-info-label">Piezas por Pallet:</span>
                                    <span class="material-info-value" id="infoPiezas">-</span>
                                </div>
                                <div class="material-info-row">
                                    <span class="material-info-label">Descripción:</span>
                                    <span class="material-info-value" id="infoDescripcion">-</span>
                                </div>
                            </div>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div class="form-group">
                                <label><i class="fas fa-layer-group"></i> Cantidad de Pallets:</label>
                                <input type="number" id="cantidadPallets" min="1" value="1" onchange="calcularTotal()">
                            </div>
                            
                            <div class="form-group">
                                <label><i class="fas fa-calculator"></i> Total de Piezas:</label>
                                <input type="text" id="totalPiezas" readonly>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-sticky-note"></i> Observaciones:</label>
                            <textarea id="observaciones" rows="3" placeholder="Comentarios adicionales..."></textarea>
                        </div>
                        
                        <div class="button-group">
                            <button type="button" class="btn btn-secondary" onclick="limpiarFormulario()">
                                <i class="fas fa-eraser"></i> Limpiar
                            </button>
                            <button type="submit" class="btn btn-primary" id="btnGuardar" disabled>
                                <i class="fas fa-save"></i> Guardar Orden
                            </button>
                        </div>
                    </form>
                </div>

                <!-- TAB 2: CONSULTA HISTÓRICO -->
                <div id="historico" class="tab-pane">
                    <div style="margin-bottom: 20px;">
                        <h3 style="margin-bottom: 15px; color: #333;">
                            <i class="fas fa-filter"></i> Filtrar por Estado
                        </h3>
                        <div class="filter-group">
                            <button class="filter-btn active" onclick="filtrarOrdenes('TODOS', this)">
                                <i class="fas fa-list"></i> Todas
                            </button>
                            <button class="filter-btn" onclick="filtrarOrdenes('PENDIENTE', this)">
                                <i class="fas fa-clock"></i> Pendiente
                            </button>
                            <button class="filter-btn" onclick="filtrarOrdenes('APROBADA', this)">
                                <i class="fas fa-check-circle"></i> Aprobada
                            </button>
                            <button class="filter-btn" onclick="filtrarOrdenes('RECIBIDA', this)">
                                <i class="fas fa-inbox"></i> Recibida
                            </button>
                            <button class="filter-btn" onclick="filtrarOrdenes('FOLIADA', this)">
                                <i class="fas fa-file-alt"></i> Foliada
                            </button>
                            <button class="filter-btn" onclick="filtrarOrdenes('PAGADA', this)">
                                <i class="fas fa-credit-card"></i> Pagada
                            </button>
                        </div>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Número OCI</th>
                                    <th>Fecha</th>
                                    <th>Material</th>
                                    <th>Pallets</th>
                                    <th>Total Piezas</th>
                                    <th>Usuario</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="ordenesTableBody">
                                <tr>
                                    <td colspan="8" style="text-align: center; padding: 40px;">
                                        <i class="fas fa-spinner fa-spin" style="font-size: 24px; color: #667eea;"></i>
                                        <p style="margin-top: 10px; color: #999;">Cargando órdenes...</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
   <script>
    // ===== CONFIGURACIÓN SUPABASE =====
    if (!window.supabaseClient) {
        const supabaseUrl = 'https://bdrxcilsuxbkpmolfbgu.supabase.co';
        const supabaseKey = 'TU_ANON_KEY_AQUI';
        window.supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
    }

    const supabaseClient = window.supabaseClient;

        // Materiales de cartón
        const materiales = [
            { numero: '1482388', piezas: 760, descripcion: 'Material cartón 1482388' },
            { numero: '1482387', piezas: 350, descripcion: 'Material cartón 1482387' },
            { numero: '632545', piezas: 10, descripcion: 'Material cartón 632545 (10 x Caja)' },
            { numero: '1482386', piezas: 500, descripcion: 'Material cartón 1482386' },
            { numero: '1482385', piezas: 600, descripcion: 'Material cartón 1482385' },
            { numero: '1482384', piezas: 800, descripcion: 'Material cartón 1482384' },
            { numero: '1482383', piezas: 400, descripcion: 'Material cartón 1482383' },
            { numero: '1482382', piezas: 550, descripcion: 'Material cartón 1482382' },
            { numero: '1482381', piezas: 700, descripcion: 'Material cartón 1482381' },
            { numero: '1482380', piezas: 450, descripcion: 'Material cartón 1482380' },
            { numero: '1482379', piezas: 650, descripcion: 'Material cartón 1482379' },
            { numero: '1482378', piezas: 750, descripcion: 'Material cartón 1482378' },
            { numero: '1482377', piezas: 520, descripcion: 'Material cartón 1482377' },
            { numero: '1482376', piezas: 680, descripcion: 'Material cartón 1482376' },
            { numero: '1482375', piezas: 580, descripcion: 'Material cartón 1482375' },
            { numero: '1482374', piezas: 720, descripcion: 'Material cartón 1482374' },
            { numero: '1482373', piezas: 480, descripcion: 'Material cartón 1482373' }
        ];

        let materialSeleccionado = null;
        let usuarioActual = null;
        let filtroActual = 'TODOS';

        // ===== INICIALIZACIÓN =====
        document.addEventListener('DOMContentLoaded', function() {
            cargarUsuario();
            cargarMaterialesSelect();
            configurarFormulario();
            configurarPestanas();
            generarNumeroOCI();
            cargarOrdenes();
        });

        // ===== CONFIGURAR PESTAÑAS =====
        function configurarPestanas() {
            document.querySelectorAll('.tab-button').forEach(button => {
                button.addEventListener('click', function() {
                    const nombrePestana = this.getAttribute('data-tab');
                    cambiarPestana(nombrePestana, this);
                });
            });
        }

        function cambiarPestana(nombrePestana, elemento) {
            // Remover activos
            document.querySelectorAll('.tab-pane').forEach(pane => {
                pane.classList.remove('active');
            });

            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // Agregar activos
            document.getElementById(nombrePestana).classList.add('active');
            elemento.classList.add('active');

            // Cargar datos si es histórico
            if (nombrePestana === 'historico') {
                cargarOrdenes();
            }
        }

        // ===== CARGAR USUARIO =====
        async function cargarUsuario() {
            try {
                const storedUser = localStorage.getItem('current_user');
                if (!storedUser) {
                    window.location.href = 'login_completo.html';
                    return;
                }

                usuarioActual = JSON.parse(storedUser);
                document.getElementById('usuarioSolicitante').value = usuarioActual.nombre_completo || usuarioActual.username;
                document.getElementById('usuario-actual').textContent = usuarioActual.nombre_completo || usuarioActual.username;
            } catch (error) {
                console.error('Error cargando usuario:', error);
            }
        }

        // ===== CARGAR MATERIALES =====
        function cargarMaterialesSelect() {
            const select = document.getElementById('materialSelect');
            
            materiales.forEach((material, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = material.numero + ' - ' + material.descripcion + ' (' + material.piezas + ' piezas/pallet)';
                select.appendChild(option);
            });
        }

        // ===== SELECCIONAR MATERIAL =====
        function seleccionarMaterial() {
            const select = document.getElementById('materialSelect');
            const index = select.value;

            if (index === '') {
                materialSeleccionado = null;
                document.getElementById('materialInfo').classList.remove('active');
                document.getElementById('btnGuardar').disabled = true;
                document.getElementById('totalPiezas').value = '';
                return;
            }

            materialSeleccionado = materiales[index];
            
            document.getElementById('infoNumero').textContent = materialSeleccionado.numero;
            document.getElementById('infoPiezas').textContent = materialSeleccionado.piezas + ' piezas/pallet';
            document.getElementById('infoDescripcion').textContent = materialSeleccionado.descripcion;
            document.getElementById('materialInfo').classList.add('active');

            document.getElementById('btnGuardar').disabled = false;
            calcularTotal();
        }

        // ===== CALCULAR TOTAL =====
        function calcularTotal() {
            if (materialSeleccionado) {
                const cantidadPallets = parseInt(document.getElementById('cantidadPallets').value) || 1;
                const total = cantidadPallets * materialSeleccionado.piezas;
                document.getElementById('totalPiezas').value = total.toLocaleString();
            }
        }

        // ===== CONFIGURAR FORMULARIO =====
        function configurarFormulario() {
            const fecha = new Date();
            fecha.setMinutes(fecha.getMinutes() - fecha.getTimezoneOffset());
            document.getElementById('fechaCreacion').value = fecha.toISOString().slice(0, 16);

            document.getElementById('ordenForm').addEventListener('submit', guardarOrden);
        }

        // ===== GENERAR NÚMERO OCI =====
        async function generarNumeroOCI() {
            try {
                const fecha = new Date();
                const año = fecha.getFullYear();
                const mes = String(fecha.getMonth() + 1).padStart(2, '0');
                
                const { data, error } = await supabaseClient
                    .from('ordenes_compra')
                    .select('numero_oci')
                    .like('numero_oci', 'OCI-' + año + '-%')
                    .order('numero_oci', { ascending: false })
                    .limit(1);

                let numero = 1;
                if (data && data.length > 0) {
                    const ultimoNumero = data[0].numero_oci;
                    const numeroActual = parseInt(ultimoNumero.split('-')[3]) || 0;
                    numero = numeroActual + 1;
                }

                const numeroOCI = 'OCI-' + año + '-' + mes + '-' + String(numero).padStart(3, '0');
                document.getElementById('numeroOci').value = numeroOCI;
            } catch (error) {
                console.error('Error generando número OCI:', error);
            }
        }

        // ===== GUARDAR ORDEN =====
        async function guardarOrden(event) {
            event.preventDefault();

            if (!materialSeleccionado) {
                alert('Debes seleccionar un material');
                return;
            }

            const btnGuardar = document.getElementById('btnGuardar');
            btnGuardar.disabled = true;
            btnGuardar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';

            try {
                const orden = {
                    numero_oci: document.getElementById('numeroOci').value,
                    fecha_creacion: new Date(document.getElementById('fechaCreacion').value).toISOString(),
                    usuario_solicitante_id: usuarioActual.id,
                    material_numero: materialSeleccionado.numero,
                    piezas_por_pallet: materialSeleccionado.piezas,
                    cantidad_pallets: parseInt(document.getElementById('cantidadPallets').value),
                    observaciones: document.getElementById('observaciones').value || null,
                    estado: 'PENDIENTE'
                };

                const { data, error } = await supabaseClient
                    .from('ordenes_compra')
                    .insert([orden])
                    .select();

                if (error) {
                    alert('Error guardando la orden: ' + error.message);
                    return;
                }

                alert('Orden de compra creada exitosamente');
                limpiarFormulario();
                cargarOrdenes();
                
            } catch (error) {
                console.error('Error:', error);
                alert('Error inesperado: ' + error.message);
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.innerHTML = '<i class="fas fa-save"></i> Guardar Orden';
            }
        }

        // ===== LIMPIAR FORMULARIO =====
        function limpiarFormulario() {
            document.getElementById('ordenForm').reset();
            document.getElementById('materialSelect').value = '';
            materialSeleccionado = null;
            document.getElementById('btnGuardar').disabled = true;
            document.getElementById('totalPiezas').value = '';
            document.getElementById('materialInfo').classList.remove('active');
            generarNumeroOCI();
            const fecha = new Date();
            fecha.setMinutes(fecha.getMinutes() - fecha.getTimezoneOffset());
            document.getElementById('fechaCreacion').value = fecha.toISOString().slice(0, 16);
        }

        // ===== CARGAR ÓRDENES =====
        async function cargarOrdenes() {
            try {
                const { data, error } = await supabaseClient
                    .from('ordenes_compra')
                    .select('*, usuarios_carton!ordenes_compra_usuario_solicitante_id_fkey(nombre_completo)')
                    .order('fecha_creacion', { ascending: false });

                if (error) {
                    console.error('Error cargando órdenes:', error);
                    return;
                }

                renderizarTablaOrdenes(data || []);

            } catch (error) {
                console.error('Error:', error);
            }
        }

        // ===== FILTRAR ÓRDENES =====
        function filtrarOrdenes(estado, elemento) {
            filtroActual = estado;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            elemento.classList.add('active');

            cargarOrdenes();
        }

        // ===== RENDERIZAR TABLA =====
        function renderizarTablaOrdenes(ordenes) {
            const tbody = document.getElementById('ordenesTableBody');
            
            let ordenesFiltradas = ordenes;
            if (filtroActual !== 'TODOS') {
                ordenesFiltradas = ordenes.filter(o => o.estado === filtroActual);
            }

            if (ordenesFiltradas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><i class="fas fa-inbox"></i><p>No hay órdenes con este estado</p></div></td></tr>';
                return;
            }

            tbody.innerHTML = ordenesFiltradas.map(orden => {
                const fecha = new Date(orden.fecha_creacion).toLocaleDateString('es-ES');
                const totalPiezas = orden.cantidad_total_piezas || (orden.piezas_por_pallet * orden.cantidad_pallets);
                const usuario = orden.usuarios_carton?.nombre_completo || 'N/A';
                
                return '<tr>' +
                    '<td><strong>' + orden.numero_oci + '</strong></td>' +
                    '<td>' + fecha + '</td>' +
                    '<td>#' + orden.material_numero + '</td>' +
                    '<td>' + orden.cantidad_pallets + '</td>' +
                    '<td>' + totalPiezas.toLocaleString() + '</td>' +
                    '<td>' + usuario + '</td>' +
                    '<td><span class="status status-' + orden.estado.toLowerCase() + '">' + orden.estado + '</span></td>' +
                    '<td><button class="btn btn-sm btn-info" onclick="verDetallesOrden(' + orden.id + ')" title="Ver detalles"><i class="fas fa-eye"></i> Ver</button></td>' +
                    '</tr>';
            }).join('');
        }

        // ===== VER DETALLES =====
        async function verDetallesOrden(ociId) {
            try {
                const { data: orden, error } = await supabaseClient
                    .from('ordenes_compra')
                    .select('*, usuarios_carton!ordenes_compra_usuario_solicitante_id_fkey(nombre_completo)')
                    .eq('id', ociId)
                    .single();

                if (error) throw error;

                const totalPiezas = orden.cantidad_total_piezas || (orden.piezas_por_pallet * orden.cantidad_pallets);
                alert('Detalles de la orden:\n\nOCI: ' + orden.numero_oci + '\nMaterial: ' + orden.material_numero + '\nPallets: ' + orden.cantidad_pallets + '\nTotal Piezas: ' + totalPiezas + '\nEstado: ' + orden.estado + '\nFecha: ' + new Date(orden.fecha_creacion).toLocaleDateString('es-ES'));
            } catch (error) {
                console.error('Error:', error);
                alert('Error cargando detalles');
            }
        }

        // ===== VOLVER AL INDEX =====
        function volverAlIndex() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
