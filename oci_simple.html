<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden de Compra - Material de Cartón</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- (Tu CSS existente va aquí, no es necesario cambiarlo ) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header-left p {
            opacity: 0.9;
            font-size: 14px;
        }

        .btn-volver {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-volver:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .user-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
        }

        /* PESTAÑAS */
        .tabs-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 30px;
        }

        .tabs-header {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            background: #f8f9fa;
        }

        .tab-button {
            flex: 1;
            padding: 16px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
            position: relative;
            text-align: center;
        }

        .tab-button:hover {
            background: #f0f1f5;
            color: #333;
        }

        .tab-button.active {
            color: #667eea;
            background: white;
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .tabs-content {
            padding: 30px;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* FORMULARIO */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[readonly], input[disabled] {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23667eea' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e" );
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            padding-right: 40px;
        }

        .material-info {
            background: #f0f1f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .material-info.active {
            display: block;
        }

        .material-info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .material-info-row:last-child {
            border-bottom: none;
        }

        .material-info-label {
            font-weight: 600;
            color: #666;
        }

        .material-info-value {
            color: #333;
            font-weight: 500;
        }

        /* BOTONES */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }
        
        .btn-add {
            background: #28a745;
            color: white;
            flex: none; /* No expandir */
            width: auto;
            padding: 12px 20px;
        }

        .btn-add:hover {
            background: #218838;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* TABLA */
        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            color: #666;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #e0e0e0;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pendiente { background: #fff3cd; color: #856404; }
        .status-aprobada { background: #d4edda; color: #155724; }
        .status-recibida { background: #cfe2ff; color: #084298; }
        .status-foliada { background: #d1e7dd; color: #0f5132; }
        .status-pagada { background: #f8d7da; color: #721c24; }

        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-info { background: #0066cc; color: white; }
        .btn-info:hover { background: #0052a3; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }

        .empty-state { text-align: center; padding: 40px 20px; color: #999; }
        .empty-state i { font-size: 48px; margin-bottom: 15px; opacity: 0.5; }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 15px; }
            .button-group { flex-direction: column; }
            table { font-size: 12px; }
            th, td { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1><i class="fas fa-boxes"></i> Gestión de Órdenes de Compra Interna</h1>
                <p>Sistema de Control de Cartón - OCI</p>
            </div>
            <button onclick="volverAlIndex()" class="btn-volver">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
        </div>

        <!-- User Info -->
        <div class="user-info">
            <strong>Usuario:</strong> <span id="usuario-actual">Cargando...</span>
        </div>

        <!-- Tabs Container -->
        <div class="tabs-container">
            <div class="tabs-header">
                <button class="tab-button active" data-tab="crear">
                    <i class="fas fa-plus-circle"></i> Crear OCI
                </button>
                <button class="tab-button" data-tab="historico">
                    <i class="fas fa-history"></i> Consulta Histórico de OCI
                </button>
            </div>

            <div class="tabs-content">
                <!-- TAB 1: CREAR OCI -->
                <div id="crear" class="tab-pane active">
                    <form id="ordenForm">
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                            <div class="form-group">
                                <label><i class="fas fa-hashtag"></i> Número de OCI:</label>
                                <input type="text" id="numeroOci" readonly>
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-calendar"></i> Fecha de Creación:</label>
                                <input type="datetime-local" id="fechaCreacion" readonly>
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-user"></i> Usuario que Solicita:</label>
                                <input type="text" id="usuarioSolicitante" readonly>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-cube"></i> Seleccionar Material de Cartón:</label>
                            <select id="materialSelect" onchange="seleccionarMaterial()">
                                <option value="">-- Selecciona un material --</option>
                            </select>
                            <div id="materialInfo" class="material-info"></div>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; align-items: flex-end;">
                            <div class="form-group">
                                <label><i class="fas fa-layer-group"></i> Cantidad de Pallets:</label>
                                <input type="number" id="cantidadPallets" min="1" value="1" oninput="calcularTotal()">
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-calculator"></i> Total de Piezas (auto):</label>
                                <input type="number" id="totalPiezas" min="0">
                            </div>
                            <div class="form-group">
                                <button type="button" class="btn btn-add" onclick="agregarMaterialALaOrden()">
                                    <i class="fas fa-plus"></i> Agregar Material
                                </button>
                            </div>
                        </div>

                        <hr style="margin: 20px 0; border: 1px solid #eee;">

                        <h3 style="margin-bottom: 15px; color: #333;"><i class="fas fa-list-alt"></i> Materiales en esta OCI</h3>
                        <div class="table-container" style="margin-bottom: 20px;">
                            <table id="tablaMaterialesOci">
                                <thead>
                                    <tr>
                                        <th>Material</th>
                                        <th>Pallets</th>
                                        <th>Total Piezas</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="bodyTablaMaterialesOci">
                                    <!-- Las filas se agregarán dinámicamente aquí -->
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-sticky-note"></i> Observaciones Generales:</label>
                            <textarea id="observaciones" rows="3" placeholder="Comentarios adicionales para toda la orden..."></textarea>
                        </div>
                        
                        <div class="button-group">
                            <button type="button" class="btn btn-secondary" onclick="limpiarFormulario()">
                                <i class="fas fa-eraser"></i> Limpiar
                            </button>
                            <button type="submit" class="btn btn-primary" id="btnGuardar" disabled>
                                <i class="fas fa-save"></i> Guardar Orden
                            </button>
                        </div>
                    </form>
                </div>

                <!-- TAB 2: CONSULTA HISTÓRICO -->
                <div id="historico" class="tab-pane">
                    <!-- ... (El contenido del histórico no cambia) ... -->
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
   <script>
       // ===== CONFIGURACIÓN SUPABASE =====
    if (!window.supabaseClient) {
        const supabaseUrl = 'https://bdrxcilsuxbkpmolfbgu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkcnhjaWxzdXhia3Btb2xmYmd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQyNTQ0NTcsImV4cCI6MjA2OTgzMDQ1N30.iSO9EoOMEoi_VARxPqMd2yMUvQvTmKJntxJvwAl-TVs';
        window.supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey );
    }
    const supabaseClient = window.supabaseClient;

    // ===== DATOS Y ESTADO GLOBAL =====
    const materiales = [
        { numero: '1482388', piezas: 760, descripcion: 'Material cartón 1482388' },
        { numero: '1482387', piezas: 350, descripcion: 'Material cartón 1482387' },
        { numero: '632545', piezas: 10, descripcion: 'Material cartón 632545 (10 x Caja)' },
        { numero: '1482386', piezas: 500, descripcion: 'Material cartón 1482386' },
        { numero: '1482385', piezas: 600, descripcion: 'Material cartón 1482385' },
        { numero: '1482384', piezas: 800, descripcion: 'Material cartón 1482384' },
        { numero: '1482383', piezas: 400, descripcion: 'Material cartón 1482383' },
        { numero: '1482382', piezas: 550, descripcion: 'Material cartón 1482382' },
        { numero: '1482381', piezas: 700, descripcion: 'Material cartón 1482381' },
        { numero: '1482380', piezas: 450, descripcion: 'Material cartón 1482380' },
        { numero: '1482379', piezas: 650, descripcion: 'Material cartón 1482379' },
        { numero: '1482378', piezas: 750, descripcion: 'Material cartón 1482378' },
        { numero: '1482377', piezas: 520, descripcion: 'Material cartón 1482377' },
        { numero: '1482376', piezas: 680, descripcion: 'Material cartón 1482376' },
        { numero: '1482375', piezas: 580, descripcion: 'Material cartón 1482375' },
        { numero: '1482374', piezas: 720, descripcion: 'Material cartón 1482374' },
        { numero: '1482373', piezas: 480, descripcion: 'Material cartón 1482373' }
    ];

    let materialSeleccionado = null;
    let usuarioActual = null;
    let filtroActual = 'TODOS';
    let materialesEnOrden = [];
    let historicoConfigurado = false; // <<-- NUEVO: Flag para evitar re-asignar eventos

    // ===== INICIALIZACIÓN =====
    document.addEventListener('DOMContentLoaded', function() {
        // Asignación de eventos para elementos siempre visibles
        document.getElementById('btnVolver').addEventListener('click', volverAlIndex);
        document.getElementById('materialSelect').addEventListener('change', seleccionarMaterial);
        document.getElementById('cantidadPallets').addEventListener('input', calcularTotal);
        document.getElementById('btnAgregarMaterial').addEventListener('click', agregarMaterialALaOrden);
        document.getElementById('btnLimpiar').addEventListener('click', limpiarFormulario);
        document.getElementById('ordenForm').addEventListener('submit', guardarOrden);

        // Carga de datos inicial
        cargarUsuario();
        cargarMaterialesSelect();
        configurarFormulario();
        configurarPestanas();
        generarNumeroOCI();
    });

    // ===== GESTIÓN DE PESTAÑAS (MODIFICADO) =====
    function configurarPestanas() {
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', function() {
                const nombrePestana = this.getAttribute('data-tab');
                cambiarPestana(nombrePestana, this);
            });
        });
    }

    function cambiarPestana(nombrePestana, elemento) {
        document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));

        document.getElementById(nombrePestana).classList.add('active');
        if (elemento) {
            elemento.classList.add('active');
        }

        if (nombrePestana === 'historico') {
            cargarOrdenes();
            // Asignar eventos de filtro SOLO la primera vez que se abre la pestaña
            if (!historicoConfigurado) {
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const estado = this.getAttribute('data-estado');
                        filtrarOrdenes(estado, this);
                    });
                });
                historicoConfigurado = true;
            }
        }
    }

    // ===== GESTIÓN DE USUARIO =====
    async function cargarUsuario() {
        try {
            const storedUser = localStorage.getItem('current_user');
            if (!storedUser) {
                alert('No se encontró sesión de usuario. Redirigiendo al login.');
                window.location.href = 'login_completo.html';
                return;
            }
            usuarioActual = JSON.parse(storedUser);
            const nombreUsuario = usuarioActual.nombre_completo || usuarioActual.username;
            document.getElementById('usuarioSolicitante').value = nombreUsuario;
            document.getElementById('usuario-actual').textContent = nombreUsuario;
        } catch (error) {
            console.error('Error cargando usuario:', error);
            document.getElementById('usuario-actual').textContent = 'Error al cargar';
        }
    }

    // ===== FORMULARIO DE CREACIÓN =====
    function configurarFormulario() {
        limpiarFormulario();
    }
    
    function cargarMaterialesSelect() {
        const select = document.getElementById('materialSelect');
        materiales.forEach((material, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = `${material.numero} - ${material.descripcion} (${material.piezas} pz/pallet)`;
            select.appendChild(option);
        });
    }

    function seleccionarMaterial() {
        const select = document.getElementById('materialSelect');
        const index = select.value;
        const infoDiv = document.getElementById('materialInfo');

        if (index === '') {
            materialSeleccionado = null;
            infoDiv.classList.remove('active');
            infoDiv.innerHTML = '';
            document.getElementById('totalPiezas').value = '';
            return;
        }

        materialSeleccionado = materiales[index];
        
        infoDiv.innerHTML = `
            <div class="material-info-row">
                <span class="material-info-label">Número:</span>
                <span class="material-info-value">${materialSeleccionado.numero}</span>
            </div>
            <div class="material-info-row">
                <span class="material-info-label">Piezas/Pallet:</span>
                <span class="material-info-value">${materialSeleccionado.piezas}</span>
            </div>
            <div class="material-info-row">
                <span class="material-info-label">Descripción:</span>
                <span class="material-info-value">${materialSeleccionado.descripcion}</span>
            </div>
        `;
        infoDiv.classList.add('active');
        
        document.getElementById('cantidadPallets').value = 1;
        calcularTotal();
    }

    function calcularTotal() {
        if (materialSeleccionado) {
            const cantidadPallets = parseInt(document.getElementById('cantidadPallets').value) || 0;
            const total = cantidadPallets * materialSeleccionado.piezas;
            document.getElementById('totalPiezas').value = total;
        }
    }

    function agregarMaterialALaOrden() {
        if (!materialSeleccionado) {
            alert('Por favor, selecciona un material primero.');
            return;
        }

        const cantidadPallets = parseInt(document.getElementById('cantidadPallets').value);
        const totalPiezas = parseInt(document.getElementById('totalPiezas').value);

        if (!cantidadPallets || cantidadPallets <= 0) {
            alert('La cantidad de pallets debe ser mayor a cero.');
            return;
        }
        if (isNaN(totalPiezas) || totalPiezas < 0) {
            alert('El total de piezas no es válido.');
            return;
        }

        const existente = materialesEnOrden.find(item => item.numero === materialSeleccionado.numero);
        if (existente) {
            alert('Este material ya ha sido agregado. Puede eliminarlo y volver a agregarlo si desea cambiar la cantidad.');
            return;
        }

        materialesEnOrden.push({
            ...materialSeleccionado,
            cantidad_pallets: cantidadPallets,
            total_piezas: totalPiezas
        });

        renderizarTablaMateriales();
        
        document.getElementById('materialSelect').value = '';
        seleccionarMaterial();
        document.getElementById('cantidadPallets').value = 1;
        document.getElementById('totalPiezas').value = '';
    }

    function renderizarTablaMateriales() {
        const tbody = document.getElementById('bodyTablaMaterialesOci');
        if (materialesEnOrden.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state" style="padding: 20px;">Aún no has agregado materiales a la orden.</td></tr>';
        } else {
            tbody.innerHTML = materialesEnOrden.map((item, index) => `
                <tr>
                    <td><strong>#${item.numero}</strong>  
<small>${item.descripcion}</small></td>
                    <td>${item.cantidad_pallets}</td>
                    <td>${item.total_piezas.toLocaleString()}</td>
                    <td>
                        <button type="button" class="btn btn-sm btn-danger" onclick="eliminarMaterialDeLaOrden(${index})" title="Eliminar">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }
        actualizarEstadoBotonGuardar();
    }

    function eliminarMaterialDeLaOrden(index) {
        materialesEnOrden.splice(index, 1);
        renderizarTablaMateriales();
    }

    function actualizarEstadoBotonGuardar() {
        document.getElementById('btnGuardar').disabled = materialesEnOrden.length === 0;
    }

    async function guardarOrden(event) {
        event.preventDefault();

        if (materialesEnOrden.length === 0) {
            alert('Debes agregar al menos un material a la orden.');
            return;
        }

        const btnGuardar = document.getElementById('btnGuardar');
        btnGuardar.disabled = true;
        btnGuardar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';

        try {
            const numeroOci = document.getElementById('numeroOci').value;
            const fechaCreacion = new Date(document.getElementById('fechaCreacion').value).toISOString();
            const observaciones = document.getElementById('observaciones').value || null;

            const registrosParaInsertar = materialesEnOrden.map(item => ({
                numero_oci: numeroOci,
                fecha_creacion: fechaCreacion,
                usuario_solicitante_id: usuarioActual.id,
                material_numero: item.numero,
                piezas_por_pallet: item.piezas,
                cantidad_pallets: item.cantidad_pallets,
                cantidad_total_piezas: item.total_piezas,
                observaciones: observaciones,
                estado: 'PENDIENTE'
            }));

            const { data, error } = await supabaseClient
                .from('ordenes_compra')
                .insert(registrosParaInsertar)
                .select();

            if (error) {
                throw new Error('Error guardando la orden: ' + error.message);
            }

            alert(`Orden de compra ${numeroOci} creada exitosamente con ${registrosParaInsertar.length} materiales.`);
            limpiarFormulario();
            
        } catch (error) {
            console.error('Error:', error);
            alert('Error inesperado: ' + error.message);
        } finally {
            btnGuardar.disabled = false;
            btnGuardar.innerHTML = '<i class="fas fa-save"></i> Guardar Orden';
        }
    }

    function limpiarFormulario() {
        document.getElementById('ordenForm').reset();
        document.getElementById('materialSelect').value = '';
        materialSeleccionado = null;
        materialesEnOrden = [];
        
        renderizarTablaMateriales();
        seleccionarMaterial();
        
        generarNumeroOCI();
        const fecha = new Date();
        fecha.setMinutes(fecha.getMinutes() - fecha.getTimezoneOffset());
        document.getElementById('fechaCreacion').value = fecha.toISOString().slice(0, 16);
    }

    // ===== LÓGICA DE HISTÓRICO =====
    async function cargarOrdenes() {
        const tbody = document.getElementById('ordenesTableBody');
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px;"><i class="fas fa-spinner fa-spin" style="font-size: 24px;"></i><p>Cargando órdenes...</p></td></tr>';

        try {
            let query = supabaseClient
                .from('ordenes_compra')
                .select('*, usuarios_carton!ordenes_compra_usuario_solicitante_id_fkey(nombre_completo)')
                .order('fecha_creacion', { ascending: false });

            if (filtroActual !== 'TODOS') {
                query = query.eq('estado', filtroActual);
            }

            const { data, error } = await query;

            if (error) throw error;

            renderizarTablaOrdenes(data || []);

        } catch (error) {
            console.error('Error cargando órdenes:', error);
            tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error al cargar las órdenes.</p></td></tr>';
        }
    }

    function filtrarOrdenes(estado, elemento) {
        filtroActual = estado;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        elemento.classList.add('active');
        cargarOrdenes();
    }

    function renderizarTablaOrdenes(ordenes) {
        const tbody = document.getElementById('ordenesTableBody');
        
        const ordenesAgrupadas = ordenes.reduce((acc, curr) => {
            if (!acc[curr.numero_oci]) {
                acc[curr.numero_oci] = {
                    ...curr,
                    materiales: [],
                    total_pallets: 0,
                    total_piezas_final: 0,
                };
            }
            acc[curr.numero_oci].materiales.push(curr);
            acc[curr.numero_oci].total_pallets += curr.cantidad_pallets;
            acc[curr.numero_oci].total_piezas_final += (curr.cantidad_total_piezas || (curr.piezas_por_pallet * curr.cantidad_pallets));
            return acc;
        }, {});

        const ordenesParaTabla = Object.values(ordenesAgrupadas);

        if (ordenesParaTabla.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fas fa-inbox"></i><p>No hay órdenes con este estado.</p></td></tr>';
            return;
        }

        tbody.innerHTML = ordenesParaTabla.map(orden => {
            const fecha = new Date(orden.fecha_creacion).toLocaleDateString('es-ES');
            const usuario = orden.usuarios_carton?.nombre_completo || 'N/A';
            const materialDisplay = orden.materiales.length > 1 
                ? `${orden.materiales.length} materiales` 
                : `#${orden.material_numero}`;

            return `<tr>
                <td><strong>${orden.numero_oci}</strong></td>
                <td>${fecha}</td>
                <td>${materialDisplay}</td>
                <td>${orden.total_pallets}</td>
                <td>${orden.total_piezas_final.toLocaleString()}</td>
                <td>${usuario}</td>
                <td><span class="status status-${orden.estado.toLowerCase()}">${orden.estado}</span></td>
                <td><button class="btn btn-sm btn-info" onclick="verDetallesOrden('${orden.numero_oci}')" title="Ver detalles"><i class="fas fa-eye"></i> Ver</button></td>
            </tr>`;
        }).join('');
    }

    async function verDetallesOrden(numeroOci) {
        try {
            const { data, error } = await supabaseClient
                .from('ordenes_compra')
                .select('*, usuarios_carton!ordenes_compra_usuario_solicitante_id_fkey(nombre_completo)')
                .eq('numero_oci', numeroOci);

            if (error) throw error;
            if (data.length === 0) {
                alert('No se encontraron detalles para la OCI: ' + numeroOci);
                return;
            }

            const primeraLinea = data[0];
            let detalles = `Detalles de la OCI: ${primeraLinea.numero_oci}\n`;
            detalles += `Fecha: ${new Date(primeraLinea.fecha_creacion).toLocaleString('es-ES')}\n`;
            detalles += `Usuario: ${primeraLinea.usuarios_carton?.nombre_completo || 'N/A'}\n`;
            detalles += `Estado: ${primeraLinea.estado}\n\n`;
            detalles += 'Materiales:\n';
            
            let totalPalletsGeneral = 0;
            let totalPiezasGeneral = 0;

            data.forEach(item => {
                const totalPiezasItem = item.cantidad_total_piezas || (item.piezas_por_pallet * item.cantidad_pallets);
                detalles += `- Mat. #${item.material_numero}: ${item.cantidad_pallets} pallets, ${totalPiezasItem.toLocaleString()} piezas\n`;
                totalPalletsGeneral += item.cantidad_pallets;
                totalPiezasGeneral += totalPiezasItem;
            });

            detalles += `\nTotal General: ${totalPalletsGeneral} pallets, ${totalPiezasGeneral.toLocaleString()} piezas.`;
            
            if(primeraLinea.observaciones) {
                detalles += `\n\nObservaciones: ${primeraLinea.observaciones}`;
            }

            alert(detalles);
        } catch (error) {
            console.error('Error cargando detalles:', error);
            alert('Error al cargar los detalles de la orden.');
        }
    }

    // ===== UTILIDADES =====
    async function generarNumeroOCI() {
        try {
            const fecha = new Date();
            const año = fecha.getFullYear();
            const mes = String(fecha.getMonth() + 1).padStart(2, '0');
            
            const { data, error } = await supabaseClient
                .from('ordenes_compra')
                .select('numero_oci')
                .like('numero_oci', `OCI-${año}-%`)
                .order('numero_oci', { ascending: false })
                .limit(1);

            if (error) throw error;

            let numero = 1;
            if (data && data.length > 0) {
                const ultimoNumero = parseInt(data[0].numero_oci.split('-')[3]) || 0;
                numero = ultimoNumero + 1;
            }

            const numeroOCI = `OCI-${año}-${mes}-${String(numero).padStart(3, '0')}`;
            document.getElementById('numeroOci').value = numeroOCI;
        } catch (error) {
            console.error('Error generando número OCI:', error);
            document.getElementById('numeroOci').value = 'Error al generar';
        }
    }

    function volverAlIndex() {
        window.location.href = 'index.html';
    }
    </script>
