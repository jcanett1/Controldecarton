<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden de Compra - Material de Cartón</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header-left p {
            opacity: 0.9;
            font-size: 14px;
        }

        .btn-volver {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-volver:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .user-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
        }

        /* PESTAÑAS */
        .tabs-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 30px;
        }

        .tabs-header {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            background: #f8f9fa;
        }

        .tab-button {
            flex: 1;
            padding: 16px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
            position: relative;
            text-align: center;
        }

        .tab-button:hover {
            background: #f0f1f5;
            color: #333;
        }

        .tab-button.active {
            color: #667eea;
            background: white;
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .tabs-content {
            padding: 30px;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* FORMULARIO */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[readonly], input[disabled] {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23667eea' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            padding-right: 40px;
        }

        .material-info {
            background: #f0f1f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .material-info.active {
            display: block;
        }

        .material-info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .material-info-row:last-child {
            border-bottom: none;
        }

        .material-info-label {
            font-weight: 600;
            color: #666;
        }

        .material-info-value {
            color: #333;
            font-weight: 500;
        }

        /* BOTONES */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }
        
        .btn-add {
            background: #28a745;
            color: white;
            flex: none;
            width: auto;
            padding: 12px 20px;
        }

        .btn-add:hover {
            background: #218838;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* TABLA */
        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            color: #666;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #e0e0e0;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pendiente { background: #fff3cd; color: #856404; }
        .status-aprobada { background: #d4edda; color: #155724; }
        .status-recibida { background: #cfe2ff; color: #084298; }
        .status-foliada { background: #d1e7dd; color: #0f5132; }
        .status-pagada { background: #f8d7da; color: #721c24; }

        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-info { background: #0066cc; color: white; }
        .btn-info:hover { background: #0052a3; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }

        .empty-state { text-align: center; padding: 40px 20px; color: #999; }
        .empty-state i { font-size: 48px; margin-bottom: 15px; opacity: 0.5; }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 15px; }
            .button-group { flex-direction: column; }
            table { font-size: 12px; }
            th, td { padding: 10px; }
        }

        /* MODAL DE DETALLES */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 25px;
            overflow-y: auto;
            max-height: calc(85vh - 140px);
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section:last-child {
            margin-bottom: 0;
        }

        .detail-section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #667eea;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .detail-item {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .detail-item.full-width {
            grid-column: 1 / -1;
        }

        .detail-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 15px;
            color: #333;
            font-weight: 500;
        }

        .material-list {
            background: #f8f9fa;
            border-radius: 8px;
            overflow: hidden;
        }

        .material-item {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .material-item:last-child {
            border-bottom: none;
        }

        .material-item:hover {
            background: #e9ecef;
        }

        .material-numero {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .material-numero i {
            color: #667eea;
            margin-right: 6px;
        }

        .material-cantidad {
            text-align: right;
        }

        .material-cantidad .pallets {
            font-size: 13px;
            color: #666;
        }

        .material-cantidad .piezas {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .total-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .total-label {
            font-size: 14px;
            font-weight: 500;
        }

        .total-values {
            text-align: right;
        }

        .total-values .pallets {
            font-size: 13px;
            opacity: 0.9;
        }

        .total-values .piezas {
            font-size: 18px;
            font-weight: 700;
        }

        .observaciones-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 12px 15px;
            color: #856404;
            font-size: 14px;
        }

        .observaciones-box i {
            margin-right: 8px;
        }

        .modal-footer {
            padding: 15px 25px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: flex-end;
        }

        .btn-modal {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-modal-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-modal-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1><i class="fas fa-boxes"></i> Gestión de Órdenes de Compra Interna</h1>
                <p>Sistema de Control de Cartón - OCI</p>
            </div>
            <button class="btn-volver" onclick="volverAlIndex()">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
        </div>

        <!-- User Info -->
        <div class="user-info">
            <strong>Usuario:</strong> <span id="usuario-actual">Cargando...</span>
        </div>

        <!-- Tabs Container -->
        <div class="tabs-container">
            <div class="tabs-header">
                <button class="tab-button active" data-tab="crear">
                    <i class="fas fa-plus-circle"></i> Crear OCI
                </button>
                <button class="tab-button" data-tab="historico">
                    <i class="fas fa-history"></i> Consulta Histórico de OCI
                </button>
            </div>

            <div class="tabs-content">
                <!-- TAB 1: CREAR OCI -->
                <div id="crear" class="tab-pane active">
                    <form id="ordenForm">
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                            <div class="form-group">
                                <label><i class="fas fa-hashtag"></i> Número de OCI:</label>
                                <input type="text" id="numeroOci" readonly>
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-calendar"></i> Fecha de Creación:</label>
                                <input type="datetime-local" id="fechaCreacion" readonly>
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-user"></i> Usuario que Solicita:</label>
                                <input type="text" id="usuario-actual" readonly>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-cube"></i> Seleccionar Material de Cartón:</label>
                            <select id="materialSelect" onchange="seleccionarMaterial()">
                                <option value="">-- Selecciona un material --</option>
                            </select>
                            <div id="materialInfo" class="material-info"></div>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 15px; align-items: flex-end;">
                            <div class="form-group">
                                <label><i class="fas fa-layer-group"></i> Cantidad de Pallets:</label>
                                <input type="number" id="cantidadPallets" min="1" value="1" oninput="calcularTotal()">
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-calculator"></i> Total de Piezas (editable):</label>
                                <input type="number" id="totalPiezas" min="0">
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-tag"></i> Asignar OC-MTK:</label>
                                <input type="text" id="ocMtkNumero" placeholder="Ej: MTK-12345">
                            </div>
                            <div class="form-group">
                                <button type="button" class="btn btn-add" onclick="agregarMaterialALaOrden()">
                                    <i class="fas fa-plus"></i> Agregar Material
                                </button>
                            </div>
                        </div>

                        <hr style="margin: 20px 0; border: 1px solid #eee;">

                        <h3 style="margin-bottom: 15px; color: #333;"><i class="fas fa-list-alt"></i> Materiales en esta OCI</h3>
                        <div class="table-container" style="margin-bottom: 20px;">
                            <table id="tablaMaterialesOci">
                                <thead>
                                    <tr>
                                        <th>Material</th>
                                        <th>Pallets</th>
                                        <th>Total Piezas</th>
                                        <th>OC-MTK</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="bodyTablaMaterialesOci">
                                    <!-- Las filas se agregarán dinámicamente aquí -->
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-sticky-note"></i> Observaciones Generales:</label>
                            <textarea id="observaciones" rows="3" placeholder="Comentarios adicionales para toda la orden..."></textarea>
                        </div>
                        
                        <div class="button-group">
                            <button type="button" class="btn btn-secondary" onclick="limpiarFormulario()">
                                <i class="fas fa-eraser"></i> Limpiar
                            </button>
                            <button type="submit" class="btn btn-primary" id="btnGuardar" disabled>
                                <i class="fas fa-save"></i> Guardar Orden
                            </button>
                        </div>
                    </form>
                </div>

                <!-- TAB 2: CONSULTA HISTÓRICO -->
                <div id="historico" class="tab-pane">
                    <div style="margin-bottom: 20px;">
                        <h3 style="margin-bottom: 15px; color: #333;"><i class="fas fa-filter"></i> Filtrar por Estado</h3>
                        <div class="filter-group">
                            <button class="filter-btn active" onclick="filtrarOrdenes('TODOS', this)"><i class="fas fa-list"></i> Todas</button>
                            <button class="filter-btn" onclick="filtrarOrdenes('PENDIENTE', this)"><i class="fas fa-clock"></i> Pendiente</button>
                            <button class="filter-btn" onclick="filtrarOrdenes('APROBADA', this)"><i class="fas fa-check-circle"></i> Aprobada</button>
                            <button class="filter-btn" onclick="filtrarOrdenes('RECIBIDA', this)"><i class="fas fa-inbox"></i> Recibida</button>
                            <button class="filter-btn" onclick="filtrarOrdenes('FOLIADA', this)"><i class="fas fa-file-alt"></i> Foliada</button>
                            <button class="filter-btn" onclick="filtrarOrdenes('PAGADA', this)"><i class="fas fa-credit-card"></i> Pagada</button>
                        </div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Número OCI</th>
                                    <th>Fecha</th>
                                    <th>Material</th>
                                    <th>Pallets</th>
                                    <th>Total Piezas</th>
                                    <th>Usuario</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="ordenesTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Detalles OCI -->
    <div id="modalDetalles" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-file-invoice"></i> <span id="modalTitulo">Detalles de OCI</span></h2>
                <button class="modal-close" onclick="cerrarModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Contenido dinámico -->
            </div>
            <div class="modal-footer">
                <button class="btn-modal btn-modal-primary" onclick="cerrarModal()">
                    <i class="fas fa-check"></i> Aceptar
                </button>
            </div>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        { numero: '1482383', piezas: 400, descripcion: 'Material cartón 1482383' },
        { numero: '1482382', piezas: 550, descripcion: 'Material cartón 1482382' },
        { numero: '1482381', piezas: 700, descripcion: 'Material cartón 1482381' },
        { numero: '1482380', piezas: 450, descripcion: 'Material cartón 1482380' },
        { numero: '1482379', piezas: 650, descripcion: 'Material cartón 1482379' },
        { numero: '1482378', piezas: 750, descripcion: 'Material cartón 1482378' },
        { numero: '1482377', piezas: 520, descripcion: 'Material cartón 1482377' },
        { numero: '1482376', piezas: 680, descripcion: 'Material cartón 1482376' },
        { numero: '1482375', piezas: 580, descripcion: 'Material cartón 1482375' },
        { numero: '1482374', piezas: 720, descripcion: 'Material cartón 1482374' },
        { numero: '1482373', piezas: 480, descripcion: 'Material cartón 1482373' }
    ];

    let materialSeleccionado = null;
    let usuarioActual = null;
    let filtroActual = 'TODOS';
    let materialesEnOrden = [];

    // ===== INICIALIZACIÓN =====
    document.addEventListener('DOMContentLoaded', function() {
        cargarUsuario();
        cargarMaterialesSelect();
        configurarFormulario();
        configurarPestanas();
        generarNumeroOCI();
        renderizarTablaMateriales();
    });

    // ===== GESTIÓN DE PESTAÑAS =====
    function configurarPestanas() {
        document.querySelectorAll('.tab-button').forEach(function(button) {
            button.addEventListener('click', function() {
                const nombrePestana = this.getAttribute('data-tab');
                cambiarPestana(nombrePestana, this);
            });
        });
    }

    function cambiarPestana(nombrePestana, elemento) {
        document.querySelectorAll('.tab-pane').forEach(function(pane) {
            pane.classList.remove('active');
        });
        document.querySelectorAll('.tab-button').forEach(function(btn) {
            btn.classList.remove('active');
        });

        document.getElementById(nombrePestana).classList.add('active');
        if (elemento) {
            elemento.classList.add('active');
        }

        if (nombrePestana === 'historico') {
            cargarOrdenes();
        }
    }

    // ===== GESTIÓN DE USUARIO =====
    async function cargarUsuario() {
        try {
            const storedUser = localStorage.getItem('current_user');
            if (!storedUser) {
                alert('No se encontró sesión de usuario. Redirigiendo al login.');
                window.location.href = 'login_completo.html';
                return;
            }
            usuarioActual = JSON.parse(storedUser);
            const nombreUsuario = usuarioActual.nombre_completo || usuarioActual.username;
            document.getElementById('usuarioSolicitante').value = nombreUsuario;
            document.getElementById('usuario-actual').textContent = nombreUsuario;
        } catch (error) {
            console.error('Error cargando usuario:', error);
            document.getElementById('usuario-actual').textContent = 'Error al cargar';
        }
    }

    // ===== FORMULARIO DE CREACIÓN =====
    function cargarMaterialesSelect() {
        const select = document.getElementById('materialSelect');
        materiales.forEach(function(material, index) {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = material.numero + ' - ' + material.descripcion + ' (' + material.piezas + ' pz/pallet)';
            select.appendChild(option);
        });
    }

    function seleccionarMaterial() {
        const select = document.getElementById('materialSelect');
        const index = select.value;
        const infoDiv = document.getElementById('materialInfo');

        if (index === '') {
            materialSeleccionado = null;
            infoDiv.classList.remove('active');
            infoDiv.innerHTML = '';
            document.getElementById('totalPiezas').value = '';
            return;
        }

        materialSeleccionado = materiales[index];
        
        infoDiv.innerHTML = '<div class="material-info-row">' +
            '<span class="material-info-label">Número:</span>' +
            '<span class="material-info-value">' + materialSeleccionado.numero + '</span>' +
            '</div>' +
            '<div class="material-info-row">' +
            '<span class="material-info-label">Piezas/Pallet:</span>' +
            '<span class="material-info-value">' + materialSeleccionado.piezas + '</span>' +
            '</div>' +
            '<div class="material-info-row">' +
            '<span class="material-info-label">Descripción:</span>' +
            '<span class="material-info-value">' + materialSeleccionado.descripcion + '</span>' +
            '</div>';
        infoDiv.classList.add('active');
        
        document.getElementById('cantidadPallets').value = 1;
        calcularTotal();
    }

    function calcularTotal() {
        if (materialSeleccionado) {
            const cantidadPallets = parseInt(document.getElementById('cantidadPallets').value) || 0;
            const total = cantidadPallets * materialSeleccionado.piezas;
            document.getElementById('totalPiezas').value = total;
        }
    }

    function agregarMaterialALaOrden() {
        if (!materialSeleccionado) {
            alert('Por favor, selecciona un material primero.');
            return;
        }

        const cantidadPallets = parseInt(document.getElementById('cantidadPallets').value);
        const totalPiezas = parseInt(document.getElementById('totalPiezas').value);
        const ocMtkNumero = document.getElementById('ocMtkNumero').value.trim();

        if (!cantidadPallets || cantidadPallets <= 0) {
            alert('La cantidad de pallets debe ser mayor a cero.');
            return;
        }
        if (isNaN(totalPiezas) || totalPiezas < 0) {
            alert('El total de piezas no es válido.');
            return;
        }
        if (!ocMtkNumero) {
            alert('Por favor, ingresa el número de OC-MTK para este material.');
            return;
        }

        const existente = materialesEnOrden.find(function(item) {
            return item.numero === materialSeleccionado.numero;
        });
        if (existente) {
            alert('Este material ya ha sido agregado. Puede eliminarlo y volver a agregarlo si desea cambiar la cantidad.');
            return;
        }

        materialesEnOrden.push({
            numero: materialSeleccionado.numero,
            piezas: materialSeleccionado.piezas,
            descripcion: materialSeleccionado.descripcion,
            cantidad_pallets: cantidadPallets,
            total_piezas: totalPiezas,
            oc_mtk: ocMtkNumero
        });

        renderizarTablaMateriales();
        actualizarEstadoBotonGuardar();
        
        // Limpiar selección para el siguiente material
        document.getElementById('materialSelect').value = '';
        seleccionarMaterial();
        document.getElementById('cantidadPallets').value = 1;
        document.getElementById('totalPiezas').value = '';
        document.getElementById('ocMtkNumero').value = '';
    }

    function renderizarTablaMateriales() {
        const tbody = document.getElementById('bodyTablaMaterialesOci');
        if (materialesEnOrden.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state" style="padding: 20px;">Aún no has agregado materiales a la orden.</td></tr>';
            actualizarEstadoBotonGuardar();
            return;
        }

        let html = '';
        for (let i = 0; i < materialesEnOrden.length; i++) {
            const item = materialesEnOrden[i];
            html += '<tr>' +
                '<td><strong>#' + item.numero + '</strong><br><small>' + item.descripcion + '</small></td>' +
                '<td>' + item.cantidad_pallets + '</td>' +
                '<td>' + item.total_piezas.toLocaleString() + '</td>' +
                '<td><span style="background: #e8f0fe; color: #1967d2; padding: 4px 8px; border-radius: 4px; font-weight: 600;">' + (item.oc_mtk || 'N/A') + '</span></td>' +
                '<td>' +
                '<button type="button" class="btn btn-sm btn-danger" onclick="eliminarMaterialDeLaOrden(' + i + ')" title="Eliminar">' +
                '<i class="fas fa-trash-alt"></i>' +
                '</button>' +
                '</td>' +
                '</tr>';
        }
        tbody.innerHTML = html;
        actualizarEstadoBotonGuardar();
    }

    function eliminarMaterialDeLaOrden(index) {
        materialesEnOrden.splice(index, 1);
        renderizarTablaMateriales();
    }

    function actualizarEstadoBotonGuardar() {
        document.getElementById('btnGuardar').disabled = materialesEnOrden.length === 0;
    }

    async function guardarOrden(event) {
        event.preventDefault();

        if (materialesEnOrden.length === 0) {
            alert('Debes agregar al menos un material a la orden.');
            return;
        }

        const btnGuardar = document.getElementById('btnGuardar');
        btnGuardar.disabled = true;
        btnGuardar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';

        try {
            const numeroOci = document.getElementById('numeroOci').value;
            const fechaCreacion = new Date(document.getElementById('fechaCreacion').value).toISOString();
            const observaciones = document.getElementById('observaciones').value || null;

            const registrosParaInsertar = materialesEnOrden.map(function(item) {
                return {
                    numero_oci: numeroOci,
                    fecha_creacion: fechaCreacion,
                    usuario_solicitante_id: usuarioActual.id,
                    material_numero: item.numero,
                    piezas_por_pallet: item.piezas,
                    cantidad_pallets: item.cantidad_pallets,
                    cantidad_total_piezas: item.total_piezas,
                    oc_mtk: item.oc_mtk,
                    observaciones: observaciones,
                    estado: 'PENDIENTE'
                };
            });

            const { data, error } = await supabaseClient
                .from('ordenes_compra')
                .insert(registrosParaInsertar)
                .select();

            if (error) {
                throw new Error('Error guardando la orden: ' + error.message);
            }

            alert('Orden de compra ' + numeroOci + ' creada exitosamente con ' + registrosParaInsertar.length + ' materiales.');
            limpiarFormulario();
            
        } catch (error) {
            console.error('Error:', error);
            alert('Error inesperado: ' + error.message);
        } finally {
            btnGuardar.disabled = false;
            btnGuardar.innerHTML = '<i class="fas fa-save"></i> Guardar Orden';
        }
    }

    function limpiarFormulario() {
        document.getElementById('ordenForm').reset();
        document.getElementById('materialSelect').value = '';
        materialSeleccionado = null;
        materialesEnOrden = [];
        
        renderizarTablaMateriales();
        seleccionarMaterial();
        
        generarNumeroOCI();
        const fecha = new Date();
        fecha.setMinutes(fecha.getMinutes() - fecha.getTimezoneOffset());
        document.getElementById('fechaCreacion').value = fecha.toISOString().slice(0, 16);
    }

    function configurarFormulario() {
        limpiarFormulario();
        document.getElementById('ordenForm').addEventListener('submit', guardarOrden);
    }

    // ===== LÓGICA DE HISTÓRICO =====
    async function cargarOrdenes() {
        const tbody = document.getElementById('ordenesTableBody');
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px;"><i class="fas fa-spinner fa-spin" style="font-size: 24px;"></i><p>Cargando órdenes...</p></td></tr>';

        try {
            let query = supabaseClient
                .from('ordenes_compra')
                .select('*, usuarios_carton!ordenes_compra_usuario_solicitante_id_fkey(nombre_completo)')
                .order('fecha_creacion', { ascending: false });

            if (filtroActual !== 'TODOS') {
                query = query.eq('estado', filtroActual);
            }

            const { data, error } = await query;

            if (error) throw error;

            renderizarTablaOrdenes(data || []);

        } catch (error) {
            console.error('Error cargando órdenes:', error);
            tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error al cargar las órdenes.</p></td></tr>';
        }
    }

    function filtrarOrdenes(estado, elemento) {
        filtroActual = estado;
        document.querySelectorAll('.filter-btn').forEach(function(btn) {
            btn.classList.remove('active');
        });
        elemento.classList.add('active');
        cargarOrdenes();
    }

    function renderizarTablaOrdenes(ordenes) {
        const tbody = document.getElementById('ordenesTableBody');
        
        // Agrupar por numero_oci
        const ordenesAgrupadas = {};
        ordenes.forEach(function(curr) {
            if (!ordenesAgrupadas[curr.numero_oci]) {
                ordenesAgrupadas[curr.numero_oci] = {
                    numero_oci: curr.numero_oci,
                    fecha_creacion: curr.fecha_creacion,
                    estado: curr.estado,
                    usuarios_carton: curr.usuarios_carton,
                    material_numero: curr.material_numero,
                    materiales: [],
                    total_pallets: 0,
                    total_piezas_final: 0
                };
            }
            ordenesAgrupadas[curr.numero_oci].materiales.push(curr);
            ordenesAgrupadas[curr.numero_oci].total_pallets += curr.cantidad_pallets;
            ordenesAgrupadas[curr.numero_oci].total_piezas_final += (curr.cantidad_total_piezas || (curr.piezas_por_pallet * curr.cantidad_pallets));
        });

        const ordenesParaTabla = Object.values(ordenesAgrupadas);

        if (ordenesParaTabla.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fas fa-inbox"></i><p>No hay órdenes con este estado.</p></td></tr>';
            return;
        }

        let html = '';
        ordenesParaTabla.forEach(function(orden) {
            const fecha = new Date(orden.fecha_creacion).toLocaleDateString('es-ES');
            const usuario = orden.usuarios_carton ? orden.usuarios_carton.nombre_completo : 'N/A';
            const materialDisplay = orden.materiales.length > 1 
                ? orden.materiales.length + ' materiales' 
                : '#' + orden.material_numero;

            html += '<tr>' +
                '<td><strong>' + orden.numero_oci + '</strong></td>' +
                '<td>' + fecha + '</td>' +
                '<td>' + materialDisplay + '</td>' +
                '<td>' + orden.total_pallets + '</td>' +
                '<td>' + orden.total_piezas_final.toLocaleString() + '</td>' +
                '<td>' + usuario + '</td>' +
                '<td><span class="status status-' + orden.estado.toLowerCase() + '">' + orden.estado + '</span></td>' +
                '<td><button class="btn btn-sm btn-info" onclick="verDetallesOrden(\'' + orden.numero_oci + '\')" title="Ver detalles"><i class="fas fa-eye"></i> Ver</button></td>' +
                '</tr>';
        });
        tbody.innerHTML = html;
    }

    async function verDetallesOrden(numeroOci) {
        try {
            const { data, error } = await supabaseClient
                .from('ordenes_compra')
                .select('*, usuarios_carton!ordenes_compra_usuario_solicitante_id_fkey(nombre_completo)')
                .eq('numero_oci', numeroOci);

            if (error) throw error;
            if (data.length === 0) {
                alert('No se encontraron detalles para la OCI: ' + numeroOci);
                return;
            }

            const primeraLinea = data[0];
            const fecha = new Date(primeraLinea.fecha_creacion).toLocaleString('es-ES');
            const usuario = primeraLinea.usuarios_carton ? primeraLinea.usuarios_carton.nombre_completo : 'N/A';
            const estado = primeraLinea.estado;
            
            let totalPalletsGeneral = 0;
            let totalPiezasGeneral = 0;

            // Construir lista de materiales
            let materialesHtml = '';
            data.forEach(function(item) {
                const totalPiezasItem = item.cantidad_total_piezas || (item.piezas_por_pallet * item.cantidad_pallets);
                totalPalletsGeneral += item.cantidad_pallets;
                totalPiezasGeneral += totalPiezasItem;
                
                const ocMtkDisplay = item.oc_mtk ? '<span style="background: #e8f0fe; color: #1967d2; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">OC-MTK: ' + item.oc_mtk + '</span>' : '';
                
                materialesHtml += '<div class="material-item">' +
                    '<div class="material-numero">' +
                    '<i class="fas fa-box"></i> #' + item.material_numero +
                    (ocMtkDisplay ? '<br>' + ocMtkDisplay : '') +
                    '</div>' +
                    '<div class="material-cantidad">' +
                    '<div class="pallets">' + item.cantidad_pallets + ' pallets</div>' +
                    '<div class="piezas">' + totalPiezasItem.toLocaleString() + ' pzas</div>' +
                    '</div>' +
                    '</div>';
            });

            // Construir contenido del modal
            let modalContent = '' +
                '<div class="detail-section">' +
                '<div class="detail-section-title"><i class="fas fa-info-circle"></i> Informaci\u00f3n General</div>' +
                '<div class="detail-grid">' +
                '<div class="detail-item">' +
                '<div class="detail-label">N\u00famero OCI</div>' +
                '<div class="detail-value">' + primeraLinea.numero_oci + '</div>' +
                '</div>' +
                '<div class="detail-item">' +
                '<div class="detail-label">Estado</div>' +
                '<div class="detail-value"><span class="status status-' + estado.toLowerCase() + '">' + estado + '</span></div>' +
                '</div>' +
                '<div class="detail-item">' +
                '<div class="detail-label">Fecha de Creaci\u00f3n</div>' +
                '<div class="detail-value">' + fecha + '</div>' +
                '</div>' +
                '<div class="detail-item">' +
                '<div class="detail-label">Usuario Solicitante</div>' +
                '<div class="detail-value">' + usuario + '</div>' +
                '</div>' +
                '</div>' +
                '</div>' +
                '<div class="detail-section">' +
                '<div class="detail-section-title"><i class="fas fa-boxes"></i> Materiales (' + data.length + ')</div>' +
                '<div class="material-list">' + materialesHtml + '</div>' +
                '<div class="total-section">' +
                '<div class="total-label"><i class="fas fa-calculator"></i> Total General</div>' +
                '<div class="total-values">' +
                '<div class="pallets">' + totalPalletsGeneral + ' pallets</div>' +
                '<div class="piezas">' + totalPiezasGeneral.toLocaleString() + ' piezas</div>' +
                '</div>' +
                '</div>' +
                '</div>';

            // Agregar observaciones si existen
            if (primeraLinea.observaciones) {
                modalContent += '<div class="detail-section">' +
                    '<div class="detail-section-title"><i class="fas fa-sticky-note"></i> Observaciones</div>' +
                    '<div class="observaciones-box"><i class="fas fa-comment-alt"></i>' + primeraLinea.observaciones + '</div>' +
                    '</div>';
            }

            // Mostrar modal
            document.getElementById('modalTitulo').textContent = 'OCI: ' + primeraLinea.numero_oci;
            document.getElementById('modalBody').innerHTML = modalContent;
            document.getElementById('modalDetalles').classList.add('active');

        } catch (error) {
            console.error('Error cargando detalles:', error);
            alert('Error al cargar los detalles de la orden.');
        }
    }

    function cerrarModal() {
        document.getElementById('modalDetalles').classList.remove('active');
    }

    // Cerrar modal al hacer clic fuera de él
    document.getElementById('modalDetalles').addEventListener('click', function(e) {
        if (e.target === this) {
            cerrarModal();
        }
    });

    // Cerrar modal con tecla Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            cerrarModal();
        }
    });

    // ===== UTILIDADES =====
    async function generarNumeroOCI() {
        try {
            const fecha = new Date();
            const año = fecha.getFullYear();
            const mes = String(fecha.getMonth() + 1).padStart(2, '0');
            
            const { data, error } = await supabaseClient
                .from('ordenes_compra')
                .select('numero_oci')
                .like('numero_oci', 'OCI-' + año + '-%')
                .order('numero_oci', { ascending: false })
                .limit(1);

            if (error) throw error;

            let numero = 1;
            if (data && data.length > 0) {
                const ultimoNumero = parseInt(data[0].numero_oci.split('-')[3]) || 0;
                numero = ultimoNumero + 1;
            }

            const numeroOCI = 'OCI-' + año + '-' + mes + '-' + String(numero).padStart(3, '0');
            document.getElementById('numeroOci').value = numeroOCI;
        } catch (error) {
            console.error('Error generando número OCI:', error);
            document.getElementById('numeroOci').value = 'Error al generar';
        }
    }

    function volverAlIndex() {
        window.location.href = 'index.html';
    }
    </script>
