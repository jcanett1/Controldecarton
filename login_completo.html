<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestión y Control de Órdenes de Compra de Cartón</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            background: #f5f5f5;
        }

        .login-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Lado izquierdo con imagen de fondo */
        .login-left {
            flex: 1;
            background-image: url('login-background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        .login-left::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
        }

        /* Lado derecho con formulario */
        .login-right {
            width: 480px;
            background: white;
            display: flex;
            flex-direction: column;
            padding: 60px 50px;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.1);
        }

        /* Logo y título del sistema */
        .system-header {
            text-align: right;
            margin-bottom: 60px;
        }

        .system-logo {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 8px;
        }

        .system-logo i {
            font-size: 2.5rem;
            color: #0078d4;
        }

        .system-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0078d4;
            line-height: 1.3;
            margin-bottom: 5px;
        }

        .system-subtitle {
            font-size: 0.95rem;
            color: #666;
            font-weight: 400;
        }

        /* Sección de credenciales */
        .credentials-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .credentials-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #d1d1d1;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0078d4;
            background: white;
            box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.1);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .btn-signin {
            padding: 12px 40px;
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-signin:hover {
            background: #006cbd;
            box-shadow: 0 2px 8px rgba(0, 120, 212, 0.3);
        }

        .btn-signin:active {
            transform: translateY(1px);
        }

        .btn-signin:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .forgot-link {
            color: #0078d4;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .forgot-link:hover {
            color: #006cbd;
            text-decoration: underline;
        }

        /* Loading spinner */
        .loading {
            display: none;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            color: #666;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #e0e0e0;
            border-top: 2px solid #0078d4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Alertas */
        .alert {
            padding: 12px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background: #dff6dd;
            color: #1e7e34;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Botones de prueba */
        .test-data {
            background: #fff9e6;
            border: 1px solid #ffe5a3;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .test-data strong {
            display: block;
            margin-bottom: 10px;
            color: #856404;
            font-size: 0.9rem;
        }

        .test-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-test {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #0078d4;
            background: white;
            color: #0078d4;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-test:hover {
            background: #0078d4;
            color: white;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .login-left {
                display: none;
            }

            .login-right {
                width: 100%;
                max-width: 480px;
                margin: 0 auto;
            }
        }

        @media (max-width: 480px) {
            .login-right {
                padding: 40px 30px;
            }

            .system-title {
                font-size: 1.2rem;
            }

            .system-logo i {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Lado izquierdo con imagen -->
        <div class="login-left"></div>

        <!-- Lado derecho con formulario -->
        <div class="login-right">
            <!-- Logo y título del sistema -->
            <div class="system-header">
                <div class="system-logo">
                    <i class="fas fa-boxes"></i>
                </div>
                <div class="system-title">
                    Gestión y Control de<br>Órdenes de Compra de Cartón
                </div>
                <div class="system-subtitle">
                    The Cloud ERP - PXG México
                </div>
            </div>

            <!-- Sección de credenciales -->
            <div class="credentials-section">
                <h2 class="credentials-title">Enter credentials</h2>

                <!-- Botones de prueba -->
                <div class="test-data">
                    <strong>Credenciales de Prueba:</strong>
                    <div class="test-buttons">
                        <button class="btn-test" onclick="fillTestData('julio')">Julio</button>
                        <button class="btn-test" onclick="fillTestData('admin')">Admin</button>
                    </div>
                </div>

                <!-- Alertas -->
                <div id="alert-container"></div>

                <!-- Formulario -->
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" name="username" required 
                               placeholder="Enter your username">
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" required 
                               placeholder="Enter your password">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-signin" id="login-btn">
                            Sign In
                        </button>
                        <a href="#" class="forgot-link">Forgot your credentials?</a>
                    </div>

                    <div class="loading" id="login-loading">
                        <div class="spinner"></div>
                        <span>Signing in...</span>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Configuración de Supabase
        const supabaseUrl = 'https://bdrxcilsuxbkpmolfbgu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkcnhjaWxzdXhia3Btb2xmYmd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQyNTQ0NTcsImV4cCI6MjA2OTgzMDQ1N30.iSO9EoOMEoi_VARxPqMd2yMUvQvTmKJntxJvwAl-TVs';

       if (!window.supabaseClient) {
    window.supabaseClient = window.supabase.createClient(
      supabaseUrl,
      supabaseKey
    );
  }

  var supabase = window.supabaseClient;
        // Variables globales
        let currentUser = null;

        // Llenar datos de prueba
        function fillTestData(role) {
            if (role === 'julio') {
                document.getElementById('login-username').value = 'julio';
                document.getElementById('login-password').value = 'Edel1ewy';
            } else if (role === 'admin') {
                document.getElementById('login-username').value = 'admin';
                document.getElementById('login-password').value = 'admin123';
            }
        }

        // Mostrar alertas
        function showAlert(message, type = 'error') {
            const container = document.getElementById('alert-container');
            container.innerHTML = `
                <div class="alert alert-${type} show">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                    ${message}
                </div>
            `;

            setTimeout(() => {
                clearAlerts();
            }, 5000);
        }

        // Limpiar alertas
        function clearAlerts() {
            document.getElementById('alert-container').innerHTML = '';
        }

        // Mostrar/ocultar loading
        function showLoading(show = true) {
            const button = document.getElementById('login-btn');
            const loading = document.getElementById('login-loading');

            if (show) {
                button.disabled = true;
                button.style.display = 'none';
                loading.classList.add('show');
            } else {
                button.disabled = false;
                button.style.display = 'block';
                loading.classList.remove('show');
            }
        }

        // Hash de contraseña simple (para prueba - usar bcrypt en producción)
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        // Manejar login
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            if (!username || !password) {
                showAlert('Por favor completa todos los campos');
                return;
            }

            showLoading(true);
            clearAlerts();

            try {
                console.log('🔐 Intentando login con:', username);

                // Hash de la contraseña para comparación
                const passwordHash = await hashPassword(password);

                // Buscar usuario en la tabla usuarios_carton
                const { data: userData, error: userError } = await supabase
                    .from('usuarios_carton')
                    .select('*')
                    .eq('username', username)
                    .eq('password_hash', passwordHash)
                    .eq('activo', true)
                    .single();

                if (userError || !userData) {
                    console.error('Usuario o contraseña incorrectos:', userError);
                    
                    // Intentar sin hash (contraseñas en texto plano para prueba)
                    const { data: userDataPlain, error: userErrorPlain } = await supabase
                        .from('usuarios_carton')
                        .select('*')
                        .eq('username', username)
                        .eq('password_hash', password)
                        .eq('activo', true)
                        .single();

                    if (userErrorPlain || !userDataPlain) {
                        throw new Error('Usuario o contraseña incorrectos');
                    }

                    console.log('✅ Usuario encontrado (texto plano):', userDataPlain);
                    currentUser = userDataPlain;
                } else {
                    console.log('✅ Usuario encontrado:', userData);
                    currentUser = userData;
                }

                // Actualizar último acceso
                await supabase
                    .from('usuarios_carton')
                    .update({ ultimo_acceso: new Date().toISOString() })
                    .eq('id', currentUser.id);

                // Guardar datos del usuario
                localStorage.setItem('current_user', JSON.stringify(currentUser));
                
                showAlert('¡Login exitoso! Redirigiendo...', 'success');

                // Redirigir al dashboard
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('Error en login:', error);
                showAlert(error.message || 'Error al iniciar sesión');
                showLoading(false);
            }
        });
    </script>
</body>
</html>
