<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Almacén de Cartón</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            min-height: 600px;
            display: flex;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-left {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-left::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="white" opacity="0.1"/><circle cx="75" cy="75" r="1" fill="white" opacity="0.1"/><circle cx="50" cy="10" r="0.5" fill="white" opacity="0.1"/><circle cx="10" cy="60" r="0.5" fill="white" opacity="0.1"/><circle cx="90" cy="40" r="0.5" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .welcome-text {
            position: relative;
            z-index: 1;
        }

        .welcome-text h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .welcome-text p {
            font-size: 1.1rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        .login-right {
            flex: 1;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-header h2 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .form-header p {
            color: #666;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group.has-icon {
            position: relative;
        }

        .form-group.has-icon i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .form-group.has-icon i:hover {
            color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .test-data {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .test-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-test {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-test:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                max-width: 400px;
                min-height: auto;
            }

            .login-left {
                padding: 40px 30px;
                min-height: 200px;
            }

            .welcome-text h1 {
                font-size: 2rem;
            }

            .logo {
                font-size: 2rem;
            }

            .login-right {
                padding: 40px 30px;
            }

            .form-header h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="logo">
                <i class="fas fa-boxes"></i>
            </div>
            <div class="welcome-text">
                <h1>Bienvenido</h1>
                <p>Sistema de gestión y control de inventario de cartón. Accede a tu cuenta para administrar productos, movimientos y reportes.</p>
            </div>
        </div>

        <div class="login-right">
            <div class="form-header">
                <h2>Acceso al Sistema</h2>
                <p>Inicia sesión con tus credenciales</p>
            </div>

            <div class="test-data">
                <strong>Credenciales de Prueba:</strong>
                <div class="test-buttons">
                    <button class="btn-test" onclick="fillTestData('julio')">Julio</button>
                    <button class="btn-test" onclick="fillTestData('admin')">Admin</button>
                </div>
            </div>

            <div id="alert-container"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-username">
                        <i class="fas fa-user"></i> Usuario
                    </label>
                    <input type="text" id="login-username" name="username" required 
                           placeholder="Tu usuario">
                </div>

                <div class="form-group has-icon">
                    <label for="login-password">
                        <i class="fas fa-lock"></i> Contraseña
                    </label>
                    <input type="password" id="login-password" name="password" required 
                           placeholder="Tu contraseña">
                    <i class="fas fa-eye" onclick="togglePassword('login-password', this)"></i>
                </div>

                <button type="submit" class="btn btn-primary" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>

                <div class="loading" id="login-loading">
                    <div class="spinner"></div>
                    <span>Iniciando sesión...</span>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Configuración de Supabase
        const supabaseUrl = 'https://bdrxcilsuxbkpmolfbgu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkcnhjaWxzdXhia3Btb2xmYmd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQyNTQ0NTcsImV4cCI6MjA2OTgzMDQ1N30.iSO9EoOMEoi_VARxPqMd2yMUvQvTmKJntxJvwAl-TVs';

        // Inicializar Supabase
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Variables globales
        let currentUser = null;

        // Llenar datos de prueba
        function fillTestData(role) {
            if (role === 'julio') {
                document.getElementById('login-username').value = 'julio';
                document.getElementById('login-password').value = 'Edel1ewy';
            } else if (role === 'admin') {
                document.getElementById('login-username').value = 'admin';
                document.getElementById('login-password').value = 'admin123';
            }
        }

        // Toggle password visibility
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        }

        // Mostrar alertas
        function showAlert(message, type = 'error') {
            const container = document.getElementById('alert-container');
            container.innerHTML = `
                <div class="alert alert-${type} show">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                    ${message}
                </div>
            `;

            setTimeout(() => {
                clearAlerts();
            }, 5000);
        }

        // Limpiar alertas
        function clearAlerts() {
            document.getElementById('alert-container').innerHTML = '';
        }

        // Mostrar/ocultar loading
        function showLoading(show = true) {
            const button = document.getElementById('login-btn');
            const loading = document.getElementById('login-loading');

            if (show) {
                button.disabled = true;
                button.style.display = 'none';
                loading.classList.add('show');
            } else {
                button.disabled = false;
                button.style.display = 'block';
                loading.classList.remove('show');
            }
        }

        // Hash de contraseña simple (para prueba - usar bcrypt en producción)
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        // Manejar login
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            if (!username || !password) {
                showAlert('Por favor completa todos los campos');
                return;
            }

            showLoading(true);
            clearAlerts();

            try {
                console.log('🔐 Intentando login con:', username);

                // Hash de la contraseña para comparación
                const passwordHash = await hashPassword(password);

                // Buscar usuario en la tabla usuarios_carton
                const { data: userData, error: userError } = await supabase
                    .from('usuarios_carton')
                    .select('*')
                    .eq('username', username)
                    .eq('password_hash', passwordHash)
                    .eq('activo', true)
                    .single();

                if (userError || !userData) {
                    console.error('Usuario o contraseña incorrectos:', userError);
                    
                    // Intentar sin hash (contraseñas en texto plano para prueba)
                    const { data: userDataPlain, error: userErrorPlain } = await supabase
                        .from('usuarios_carton')
                        .select('*')
                        .eq('username', username)
                        .eq('password_hash', password)
                        .eq('activo', true)
                        .single();

                    if (userErrorPlain || !userDataPlain) {
                        throw new Error('Usuario o contraseña incorrectos');
                    }

                    console.log('✅ Usuario encontrado (texto plano):', userDataPlain);
                    currentUser = userDataPlain;
                } else {
                    console.log('✅ Usuario encontrado:', userData);
                    currentUser = userData;
                }

                // Actualizar último acceso
                await supabase
                    .from('usuarios_carton')
                    .update({ ultimo_acceso: new Date().toISOString() })
                    .eq('id', currentUser.id);

                // Guardar datos del usuario
                localStorage.setItem('current_user', JSON.stringify(currentUser));
                
                showAlert('¡Login exitoso! Redirigiendo...', 'success');

                // Redirigir al dashboard
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('Error en login:', error);
                showAlert(error.message || 'Error al iniciar sesión');
                showLoading(false);
            }
        });
    </script>
</body>
</html>
